[package]
name = "coop-shuffle"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
members = ["helper"]

[dependencies]
cuda-coop = { path = "../.." }
coop-shuffle-helper = { path = "helper" }
cuda-device = { git = "https://github.com/tpn/cuda-rust.git", rev = "12be9f04b0e1a234faac8449e479f0870038477f" }
cuda-host = { git = "https://github.com/tpn/cuda-rust.git", rev = "12be9f04b0e1a234faac8449e479f0870038477f", features = ["async"] }
cuda-core = { git = "https://github.com/tpn/cuda-rust.git", rev = "12be9f04b0e1a234faac8449e479f0870038477f" }
cuda-async = { git = "https://github.com/tpn/cuda-rust.git", rev = "12be9f04b0e1a234faac8449e479f0870038477f" }
