<text x="342.5" y="354" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<rect x="384.0" y="326" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="420.5" y="354" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<rect x="462.0" y="326" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="498.5" y="354" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<text x="26" y="413" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">reduce(&quot;*&quot;)</text>
<rect x="228.0" y="384" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="264.5" y="412" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">12</text>
<rect x="306.0" y="384" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="342.5" y="412" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">12</text>
<rect x="384.0" y="384" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="420.5" y="412" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">12</text>
<rect x="462.0" y="384" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="498.5" y="412" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">12</text>
<text x="26" y="450" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Example: 2 + 1 + 3 + 2 = 8, copied into all four result positions.</text>
<path d="M26 487 H974" stroke="#cbd8e3"/>
<text x="26" y="516" font-size="20" fill="#132c47" font-weight="600" text-anchor="start">A following elementwise operation consumes the broadcast</text>
<text x="26" y="568" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">input - minimum</text>
<rect x="228.0" y="539" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="567" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="306.0" y="539" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="567" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<rect x="384.0" y="539" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="567" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<rect x="462.0" y="539" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="567" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<text x="26" y="605" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Two separate input Tiles produce two independent aggregates.</text>
</g>
</svg>
