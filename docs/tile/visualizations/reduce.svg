<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="646" viewBox="0 0 1000 646" role="img" aria-labelledby="title desc">
<title id="title">Reduction: one aggregate, broadcast to the Tile</title>
<desc id="desc">Broadcast reduction for Python broadcast=True and C++ calls without an axis. Python defaults remove reduced axes; C++ axis overloads retain them with extent one.</desc>
<rect width="1000" height="646" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="26" y="32" font-size="26" fill="#132c47" font-weight="700" text-anchor="start">Reduction: one aggregate, broadcast to the Tile</text>
<text x="26" y="60" font-size="16" fill="#29435a" font-weight="400" text-anchor="start">Python broadcast=True and C++ calls without an axis. Python returns reduced shapes by default.</text>
<text x="26" y="117" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">input</text>
<rect x="228.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<text x="264.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">0</text>
<rect x="306.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<text x="342.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">1</text>
<rect x="384.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<text x="420.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">2</text>
<rect x="462.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<text x="498.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">3</text>
<path d="M26 158 H974" stroke="#cbd8e3"/>
<text x="26" y="187" font-size="20" fill="#132c47" font-weight="600" text-anchor="start">The complete input contributes to every output</text>
<text x="26" y="239" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">sum / reduce(&quot;+&quot;)</text>
<rect x="228.0" y="210" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="264.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">8</text>
<rect x="306.0" y="210" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="342.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">8</text>
<rect x="384.0" y="210" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="420.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">8</text>
<rect x="462.0" y="210" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="498.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">8</text>
<text x="26" y="297" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">reduce(&quot;min&quot;)</text>
<rect x="228.0" y="268" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="264.5" y="296" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="306.0" y="268" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="342.5" y="296" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="384.0" y="268" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="420.5" y="296" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="462.0" y="268" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="498.5" y="296" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<text x="26" y="355" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">reduce(&quot;max&quot;)</text>
<rect x="228.0" y="326" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="264.5" y="354" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
