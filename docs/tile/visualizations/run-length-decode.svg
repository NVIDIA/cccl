<text x="26" y="605" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">run_length_decode returns the value row; with_offsets returns both rows.</text>
<text x="26" y="638" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">MAX is the unsigned length type maximum. It identifies padding, even for a zero run value.</text>
<text x="26" y="671" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">An offset at or beyond 6 produces all-zero values and all-MAX relative offsets.</text>
