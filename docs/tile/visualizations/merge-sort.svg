<text x="26" y="690" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Consume the first five results. A strict sentinel prevents padding from tying with valid keys.</text>
<text x="26" y="723" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Equal keys have no stability guarantee; use payload association rather than tie order in checks.</text>
