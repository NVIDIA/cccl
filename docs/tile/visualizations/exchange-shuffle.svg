<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="888" viewBox="0 0 1000 888" role="img" aria-labelledby="title desc">
<title id="title">Exchange and shuffle: which input supplies each output?</title>
<desc id="desc">Logical Tile input and output values; complete semantics and constraints are in the accompanying reference.</desc>
<rect width="1000" height="888" rx="8" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="26" y="32" font-size="26" fill="#132c47" font-weight="700" text-anchor="start">Exchange and shuffle: which input supplies each output?</text>
<text x="26" y="60" font-size="16" fill="#29435a" font-weight="400" text-anchor="start">Exchange uses N = 256, B = 128, I = 2. Ellipses abbreviate unchanged extent.</text>
<text x="26" y="117" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">input</text>
<rect x="228.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<text x="264.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">0</text>
<rect x="306.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<text x="342.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">1</text>
<rect x="384.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<text x="420.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">2</text>
<rect x="462.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<text x="498.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">3</text>
<rect x="540.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="576.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<text x="576.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">...</text>
<rect x="618.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="654.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">254</text>
<text x="654.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">254</text>
<rect x="696.0" y="88" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="732.5" y="116" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">255</text>
<text x="732.5" y="82" font-size="12" fill="#50677b" font-weight="400" text-anchor="middle">255</text>
<path d="M26 158 H974" stroke="#cbd8e3"/>
<text x="26" y="187" font-size="20" fill="#132c47" font-weight="600" text-anchor="start">Exchange: two inverse permutations</text>
<text x="26" y="239" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">striped to blocked</text>
<rect x="228.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<rect x="306.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">128</text>
<rect x="384.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="462.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">129</text>
<rect x="540.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="576.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<rect x="618.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="654.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">127</text>
<rect x="696.0" y="210" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="732.5" y="238" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">255</text>
<text x="26" y="276" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">output[t * 2 + j] = input[j * 128 + t], for 0 &lt;= t &lt; 128 and j in {0, 1}</text>
<text x="26" y="330" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">blocked to striped</text>
<rect x="228.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<rect x="306.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<rect x="384.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">4</text>
<rect x="462.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">6</text>
<rect x="540.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="576.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<rect x="618.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="654.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">253</text>
<rect x="696.0" y="301" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="732.5" y="329" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">255</text>
<text x="26" y="367" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">output[j * 128 + t] = input[t * 2 + j]; both rows start from the original input.</text>
<path d="M26 404 H974" stroke="#cbd8e3"/>
<text x="26" y="433" font-size="20" fill="#132c47" font-weight="600" text-anchor="start">Fixed one-item shifts on N = 128</text>
<text x="26" y="456" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Input is [0, 1, 2, ..., 126, 127]. Preserved endpoints are yellow.</text>
<text x="26" y="512" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">shuffle_up</text>
<rect x="228.0" y="483" width="73.0" height="43" rx="5" fill="#fff0c7" stroke="#7894af"/>
<text x="264.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<rect x="306.0" y="483" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<rect x="384.0" y="483" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="462.0" y="483" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<rect x="540.0" y="483" width="73.0" height="43" rx="5" fill="#edf0f3" stroke="#7894af"/>
<text x="576.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<rect x="618.0" y="483" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="654.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">125</text>
<rect x="696.0" y="483" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="732.5" y="511" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">126</text>
<text x="26" y="570" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">shuffle_down</text>
<rect x="228.0" y="541" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="306.0" y="541" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<rect x="384.0" y="541" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<rect x="462.0" y="541" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="498.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">4</text>
<rect x="540.0" y="541" width="73.0" height="43" rx="5" fill="#edf0f3" stroke="#7894af"/>
<text x="576.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<rect x="618.0" y="541" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="654.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">127</text>
<rect x="696.0" y="541" width="73.0" height="43" rx="5" fill="#fff0c7" stroke="#7894af"/>
<text x="732.5" y="569" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">127</text>
<path d="M26 611 H974" stroke="#cbd8e3"/>
<text x="26" y="640" font-size="20" fill="#132c47" font-weight="600" text-anchor="start">Offset and rotate: one item per thread, N = B = 128</text>
<text x="26" y="663" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">distance = 3; a positive distance reads a higher input index.</text>
<text x="26" y="719" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">shuffle_offset</text>
<rect x="228.0" y="690" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<rect x="306.0" y="690" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">4</text>
<rect x="384.0" y="690" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">5</text>
<rect x="462.0" y="690" width="73.0" height="43" rx="5" fill="#edf0f3" stroke="#7894af"/>
<text x="498.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<rect x="540.0" y="690" width="73.0" height="43" rx="5" fill="#fff0c7" stroke="#7894af"/>
<text x="576.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">125</text>
<rect x="618.0" y="690" width="73.0" height="43" rx="5" fill="#fff0c7" stroke="#7894af"/>
<text x="654.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">126</text>
<rect x="696.0" y="690" width="73.0" height="43" rx="5" fill="#fff0c7" stroke="#7894af"/>
<text x="732.5" y="718" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">127</text>
<text x="26" y="756" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Offset preserves i = 125, 126, 127 because i + 3 lies outside the Tile.</text>
<text x="26" y="810" font-size="16" fill="#132c47" font-weight="600" text-anchor="start">shuffle_rotate</text>
<rect x="228.0" y="781" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="264.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">3</text>
<rect x="306.0" y="781" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="342.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">4</text>
<rect x="384.0" y="781" width="73.0" height="43" rx="5" fill="#e6f0fb" stroke="#7894af"/>
<text x="420.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">5</text>
<rect x="462.0" y="781" width="73.0" height="43" rx="5" fill="#edf0f3" stroke="#7894af"/>
<text x="498.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">...</text>
<rect x="540.0" y="781" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="576.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">0</text>
<rect x="618.0" y="781" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="654.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">1</text>
<rect x="696.0" y="781" width="73.0" height="43" rx="5" fill="#e4f2dc" stroke="#7894af"/>
<text x="732.5" y="809" font-size="16" fill="#142d46" font-weight="500" text-anchor="middle">2</text>
<text x="26" y="847" font-size="15" fill="#29435a" font-weight="400" text-anchor="start">Rotate wraps those three reads to input positions 0, 1, 2.</text>
</g>
</svg>
