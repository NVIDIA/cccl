<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 426" role="img" aria-labelledby="title desc">
<title id="title">The groups a kernel can name, and three of them in one block</title>
<desc id="desc">Five levels of a launch from largest to smallest: grid, cluster, block, warp and thread, each named by a call from this_grid() to this_thread(). Block and warp are filled because primitives accept them. Below, one block of 128 threads is drawn three ways on a thread axis: as one group from this_block(), as four groups of 32 from this_warp(), and as sixteen groups of 8 from this_warp().group_by(8). A dot marks rank 0 of every group, the thread that holds that group's sum.</desc>
<rect width="760" height="426" rx="12" fill="#f7f9fc"/>
<g font-family="sans-serif">
<rect x="30.0" y="22.0" width="122.4" height="48.0" rx="6" fill="#ffffff" stroke="#68798b" stroke-width="1.2"/>
<text x="91.2" y="42.0" font-size="14" text-anchor="middle" fill="#172b3a" font-weight="600">grid</text>
<text x="91.2" y="60.0" font-size="12.5" text-anchor="middle" fill="#172b3a"><tspan font-family="monospace">this_grid()</tspan></text>
<rect x="174.4" y="22.0" width="122.4" height="48.0" rx="6" fill="#ffffff" stroke="#68798b" stroke-width="1.2"/>
<text x="235.6" y="42.0" font-size="14" text-anchor="middle" fill="#172b3a" font-weight="600">cluster</text>
<text x="235.6" y="60.0" font-size="12.5" text-anchor="middle" fill="#172b3a"><tspan font-family="monospace">this_cluster()</tspan></text>
<text x="163.4" y="51.0" font-size="18" text-anchor="middle" fill="#44556b">›</text>
<rect x="318.8" y="22.0" width="122.4" height="48.0" rx="6" fill="#c9eaf0" stroke="#68798b" stroke-width="1.2"/>
<text x="380.0" y="42.0" font-size="14" text-anchor="middle" fill="#172b3a" font-weight="600">block</text>
<text x="380.0" y="60.0" font-size="12.5" text-anchor="middle" fill="#172b3a"><tspan font-family="monospace">this_block()</tspan></text>
<text x="307.8" y="51.0" font-size="18" text-anchor="middle" fill="#44556b">›</text>
<rect x="463.2" y="22.0" width="122.4" height="48.0" rx="6" fill="#fff0bd" stroke="#68798b" stroke-width="1.2"/>
<text x="524.4" y="42.0" font-size="14" text-anchor="middle" fill="#172b3a" font-weight="600">warp</text>
<text x="524.4" y="60.0" font-size="12.5" text-anchor="middle" fill="#172b3a"><tspan font-family="monospace">this_warp()</tspan></text>
<text x="452.2" y="51.0" font-size="18" text-anchor="middle" fill="#44556b">›</text>
<rect x="607.6" y="22.0" width="122.4" height="48.0" rx="6" fill="#ffffff" stroke="#68798b" stroke-width="1.2"/>
<text x="668.8" y="42.0" font-size="14" text-anchor="middle" fill="#172b3a" font-weight="600">thread</text>
<text x="668.8" y="60.0" font-size="12.5" text-anchor="middle" fill="#172b3a"><tspan font-family="monospace">this_thread()</tspan></text>
<text x="596.6" y="51.0" font-size="18" text-anchor="middle" fill="#44556b">›</text>
<text x="30.0" y="92.0" font-size="13" text-anchor="start" fill="#44556b">Each level contains the next. Primitives take a block, a warp, or a group of lanes in a warp.</text>
<text x="30.0" y="134.0" font-size="15" text-anchor="start" fill="#172b3a" font-weight="600"><tspan font-family="monospace">this_block()</tspan></text>
<text x="730.0" y="134.0" font-size="13" text-anchor="end" fill="#44556b">128 threads · one result</text>
<rect x="33.0" y="146.0" width="694.0" height="26.0" rx="4" fill="#c9eaf0" stroke="#68798b" stroke-width="1.2"/>
<circle cx="42.0" cy="159.0" r="3.5" fill="#172b3a"/>
<text x="30.0" y="204.0" font-size="15" text-anchor="start" fill="#172b3a" font-weight="600"><tspan font-family="monospace">this_warp()</tspan></text>
<text x="730.0" y="204.0" font-size="13" text-anchor="end" fill="#44556b">32 threads each · four results</text>
