<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 248" role="img" aria-labelledby="title desc">
<title id="title">What load gives each thread of a block</title>
<desc id="desc">An array named source holds 512 Int32 values in memory. Each of the 128 threads of a block receives four consecutive values in a ThreadData named values: thread 0 holds elements 0 to 3 as values[0] to values[3], thread 1 holds elements 4 to 7, thread 2 holds 8 to 11, and thread 127 holds 508 to 511.</desc>
