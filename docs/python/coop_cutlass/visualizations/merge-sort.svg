<g font-family="sans-serif" fill="#203341">
<text x="22" y="31" font-size="21" font-weight="600">Merge Sort: keys and original positions</text>
<text x="22" y="56" font-size="14">One block, two items per thread. Each cell is key:badge; A=0, B=1, ..., P=15.</text>
<text x="22" y="90" font-size="15" font-weight="600">Inputs remain unchanged</text>
