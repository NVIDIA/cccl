<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 624" role="img" aria-labelledby="title desc">
<title id="title">Merge Sort keeps each key with its associated position</title>
<desc id="desc">Eight teaching threads own two key and position pairs each. Sorted local copies merge into runs of four, eight, then sixteen items. Final keys are zero through fifteen. Their position badges are F C P M J G D A N K H E B O L I, identifying the original positions. Inputs remain unchanged.</desc>
