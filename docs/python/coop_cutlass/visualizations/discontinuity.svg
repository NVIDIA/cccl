<text x="226" y="147" font-size="21" text-anchor="middle" font-weight="600">2</text>
<rect x="288" y="113" width="92" height="55" rx="6" fill="#c9eaf0" stroke="#8e9cac"/>
<text x="334" y="147" font-size="21" text-anchor="middle" font-weight="600">2</text>
<rect x="396" y="113" width="92" height="55" rx="6" fill="#fff0bd" stroke="#8e9cac"/>
<text x="442" y="147" font-size="21" text-anchor="middle" font-weight="600">5</text>
<rect x="504" y="113" width="92" height="55" rx="6" fill="#f5d5e4" stroke="#8e9cac"/>
<text x="550" y="147" font-size="21" text-anchor="middle" font-weight="600">5</text>
