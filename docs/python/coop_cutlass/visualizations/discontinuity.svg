<text x="766" y="147" font-size="21" text-anchor="middle" font-weight="600">9</text>
<rect x="828" y="113" width="92" height="55" rx="6" fill="#cce5e8" stroke="#8e9cac"/>
<text x="874" y="147" font-size="21" text-anchor="middle" font-weight="600">9</text>
<rect x="936" y="113" width="92" height="55" rx="6" fill="#dce2f5" stroke="#8e9cac"/>
<text x="982" y="147" font-size="21" text-anchor="middle" font-weight="600">3</text>
<text x="24" y="227" font-size="16" text-anchor="start" font-weight="600">Head flags</text>
<rect x="180" y="195" width="92" height="55" rx="6" fill="#dceac1" stroke="#8e9cac"/>
<text x="226" y="229" font-size="21" text-anchor="middle" font-weight="600">1</text>
