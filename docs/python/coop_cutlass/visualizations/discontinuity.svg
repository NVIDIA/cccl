<text x="24" y="380" font-size="14" text-anchor="start" font-weight="normal">Heads test previous != current; tails test current != next. Outputs are int32.</text>
<text x="24" y="404" font-size="14" text-anchor="start" font-weight="normal">The first head and last tail are one. The input payload remains unchanged.</text>
