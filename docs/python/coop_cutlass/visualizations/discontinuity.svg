<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
<title id="title">Discontinuity: heads and tails of equal-value runs</title>
<desc id="desc">Eight threads each own one item. Input 2,2,5,5,9,9,9,3 yields heads 1,0,1,0,1,0,0,1 and tails 0,1,0,1,0,0,1,1. No tile boundary values are supplied.</desc>
<rect width="1080" height="430" rx="12" fill="#f7f9fc"/>
<g font-family="sans-serif" fill="#203341">
<text x="24" y="34" font-size="22" text-anchor="start" font-weight="600">Discontinuity: heads and tails of equal-value runs</text>
<text x="24" y="62" font-size="15" text-anchor="start" font-weight="normal">8 teaching threads; 1 item per thread; full tile; no supplied predecessor or successor</text>
<text x="226" y="97" font-size="14" text-anchor="middle" font-weight="600">T0</text>
<text x="334" y="97" font-size="14" text-anchor="middle" font-weight="600">T1</text>
<text x="442" y="97" font-size="14" text-anchor="middle" font-weight="600">T2</text>
<text x="550" y="97" font-size="14" text-anchor="middle" font-weight="600">T3</text>
<text x="658" y="97" font-size="14" text-anchor="middle" font-weight="600">T4</text>
<text x="766" y="97" font-size="14" text-anchor="middle" font-weight="600">T5</text>
<text x="874" y="97" font-size="14" text-anchor="middle" font-weight="600">T6</text>
<text x="982" y="97" font-size="14" text-anchor="middle" font-weight="600">T7</text>
