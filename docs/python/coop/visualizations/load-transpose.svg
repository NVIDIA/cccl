  <rect x="272" y="78" width="88" height="46" rx="6" fill="#fff0c9" stroke="#68798b" />
  <text x="316" y="106" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">2   10</text>
  <path d="M 316 128 V 181" stroke="#68798b" fill="none" stroke-width="1.5" />
  <text x="438" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a">Thread 3</text>
  <rect x="394" y="78" width="88" height="46" rx="6" fill="#f8d9e7" stroke="#68798b" />
