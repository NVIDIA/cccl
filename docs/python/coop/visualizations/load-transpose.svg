  <path d="M 682 238 V 292 l -4 -6 m 4 6 l 4 -6" stroke="#68798b" fill="none" stroke-width="1.5" />
  <rect x="638" y="298" width="88" height="46" rx="6" fill="#ffe3cf" stroke="#68798b" />
