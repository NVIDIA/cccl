<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Transpose load: striped reads become blocked ownership</title>
  <desc id="desc">Eight illustrative threads read two values each. Thread zero reads positions zero and eight. Shared scratch exchanges values so thread zero finishes with positions zero and one, thread one with two and three, and so on.</desc>
  <rect width="1000" height="440" rx="12" fill="#f7f9fc" />
  <text x="24" y="32" text-anchor="start" font-family="sans-serif" font-size="15" fill="#172b3a">STRIPED MEMORY READS</text>
  <text x="976" y="32" text-anchor="end" font-family="sans-serif" font-size="14" fill="#172b3a">8 teaching threads / 2 items each</text>
  <text x="72" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a">Thread 0</text>
  <rect x="28" y="78" width="88" height="46" rx="6" fill="#e2f0cb" stroke="#68798b" />
  <text x="72" y="106" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">0   8</text>
  <path d="M 72 128 V 181" stroke="#68798b" fill="none" stroke-width="1.5" />
  <text x="194" y="65" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a">Thread 1</text>
  <rect x="150" y="78" width="88" height="46" rx="6" fill="#d3eff6" stroke="#68798b" />
