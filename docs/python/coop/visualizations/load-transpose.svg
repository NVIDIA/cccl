  <path d="M 926 238 V 292 l -4 -6 m 4 6 l 4 -6" stroke="#68798b" fill="none" stroke-width="1.5" />
  <rect x="882" y="298" width="88" height="46" rx="6" fill="#e0e7ef" stroke="#68798b" />
  <text x="926" y="327" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#172b3a">14   15</text>
  <text x="926" y="369" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#172b3a">Thread 7</text>
  <text x="24" y="409" text-anchor="start" font-family="sans-serif" font-size="15" fill="#172b3a">BLOCKED OUTPUT</text>
  <text x="976" y="409" text-anchor="end" font-family="sans-serif" font-size="14" fill="#172b3a">Each thread owns two consecutive values.</text>
