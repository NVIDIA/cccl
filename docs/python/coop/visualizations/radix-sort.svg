<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Two stable digit passes sort keys and associated values</title>
<desc id="desc">Eight threads start with unsigned keys 35, 18, 33, 2, 35, 17, 1, 18. Values identify original positions. Stable sorting by bits zero through three and then four through seven gives keys 1, 2, 17, 18, 18, 33, 35, 35 with original positions 6, 3, 5, 1, 7, 2, 0, 4.</desc>
<rect width="1000" height="470" rx="12" fill="#f7f9fc"/>
<g font-family="sans-serif" fill="#172b3a">
<text x="24" y="35" font-size="15">INPUT: blocked keys and associated original positions</text>
<text x="70" y="58" text-anchor="middle" font-size="12">T0</text>
<rect x="24" y="68" width="92" height="64" rx="6" fill="#e2f0cb" stroke="#68798b"/>
<text x="70" y="96" text-anchor="middle" font-size="19">35</text>
<text x="70" y="118" text-anchor="middle" font-size="13">value 0</text>
<text x="192" y="58" text-anchor="middle" font-size="12">T1</text>
<rect x="146" y="68" width="92" height="64" rx="6" fill="#d3eff6" stroke="#68798b"/>
<text x="192" y="96" text-anchor="middle" font-size="19">18</text>
<text x="192" y="118" text-anchor="middle" font-size="13">value 1</text>
<text x="314" y="58" text-anchor="middle" font-size="12">T2</text>
<rect x="268" y="68" width="92" height="64" rx="6" fill="#fff0c9" stroke="#68798b"/>
<text x="314" y="96" text-anchor="middle" font-size="19">33</text>
<text x="314" y="118" text-anchor="middle" font-size="13">value 2</text>
<text x="436" y="58" text-anchor="middle" font-size="12">T3</text>
<rect x="390" y="68" width="92" height="64" rx="6" fill="#f8d9e7" stroke="#68798b"/>
<text x="436" y="96" text-anchor="middle" font-size="19">2</text>
<text x="436" y="118" text-anchor="middle" font-size="13">value 3</text>
<text x="558" y="58" text-anchor="middle" font-size="12">T4</text>
<rect x="512" y="68" width="92" height="64" rx="6" fill="#e7dff4" stroke="#68798b"/>
<text x="558" y="96" text-anchor="middle" font-size="19">35</text>
<text x="558" y="118" text-anchor="middle" font-size="13">value 4</text>
<text x="680" y="58" text-anchor="middle" font-size="12">T5</text>
<rect x="634" y="68" width="92" height="64" rx="6" fill="#ffe3cf" stroke="#68798b"/>
<text x="680" y="96" text-anchor="middle" font-size="19">17</text>
<text x="680" y="118" text-anchor="middle" font-size="13">value 5</text>
<text x="802" y="58" text-anchor="middle" font-size="12">T6</text>
<rect x="756" y="68" width="92" height="64" rx="6" fill="#d0eee8" stroke="#68798b"/>
<text x="802" y="96" text-anchor="middle" font-size="19">1</text>
<text x="802" y="118" text-anchor="middle" font-size="13">value 6</text>
<text x="924" y="58" text-anchor="middle" font-size="12">T7</text>
<rect x="878" y="68" width="92" height="64" rx="6" fill="#e0e7ef" stroke="#68798b"/>
<text x="924" y="96" text-anchor="middle" font-size="19">18</text>
<text x="924" y="118" text-anchor="middle" font-size="13">value 7</text>
<text x="24" y="170" font-size="15">PASS 1: bits [0, 4), stable scatter</text>
<text x="70" y="193" text-anchor="middle" font-size="12">T0</text>
<rect x="24" y="203" width="92" height="64" rx="6" fill="#fff0c9" stroke="#68798b"/>
<text x="70" y="231" text-anchor="middle" font-size="19">33</text>
<text x="70" y="253" text-anchor="middle" font-size="13">value 2</text>
<text x="192" y="193" text-anchor="middle" font-size="12">T1</text>
<rect x="146" y="203" width="92" height="64" rx="6" fill="#ffe3cf" stroke="#68798b"/>
<text x="192" y="231" text-anchor="middle" font-size="19">17</text>
<text x="192" y="253" text-anchor="middle" font-size="13">value 5</text>
<text x="314" y="193" text-anchor="middle" font-size="12">T2</text>
<rect x="268" y="203" width="92" height="64" rx="6" fill="#d0eee8" stroke="#68798b"/>
<text x="314" y="231" text-anchor="middle" font-size="19">1</text>
<text x="314" y="253" text-anchor="middle" font-size="13">value 6</text>
<text x="436" y="193" text-anchor="middle" font-size="12">T3</text>
<rect x="390" y="203" width="92" height="64" rx="6" fill="#d3eff6" stroke="#68798b"/>
<text x="436" y="231" text-anchor="middle" font-size="19">18</text>
<text x="436" y="253" text-anchor="middle" font-size="13">value 1</text>
<text x="558" y="193" text-anchor="middle" font-size="12">T4</text>
<rect x="512" y="203" width="92" height="64" rx="6" fill="#f8d9e7" stroke="#68798b"/>
<text x="558" y="231" text-anchor="middle" font-size="19">2</text>
<text x="558" y="253" text-anchor="middle" font-size="13">value 3</text>
<text x="680" y="193" text-anchor="middle" font-size="12">T5</text>
<rect x="634" y="203" width="92" height="64" rx="6" fill="#e0e7ef" stroke="#68798b"/>
<text x="680" y="231" text-anchor="middle" font-size="19">18</text>
<text x="680" y="253" text-anchor="middle" font-size="13">value 7</text>
<text x="802" y="193" text-anchor="middle" font-size="12">T6</text>
<rect x="756" y="203" width="92" height="64" rx="6" fill="#e2f0cb" stroke="#68798b"/>
<text x="802" y="231" text-anchor="middle" font-size="19">35</text>
<text x="802" y="253" text-anchor="middle" font-size="13">value 0</text>
<text x="924" y="193" text-anchor="middle" font-size="12">T7</text>
<rect x="878" y="203" width="92" height="64" rx="6" fill="#e7dff4" stroke="#68798b"/>
<text x="924" y="231" text-anchor="middle" font-size="19">35</text>
<text x="924" y="253" text-anchor="middle" font-size="13">value 4</text>
<text x="24" y="305" font-size="15">PASS 2: bits [4, 8), stable scatter and returned blocked order</text>
<text x="70" y="328" text-anchor="middle" font-size="12">T0</text>
<rect x="24" y="338" width="92" height="64" rx="6" fill="#d0eee8" stroke="#68798b"/>
<text x="70" y="366" text-anchor="middle" font-size="19">1</text>
<text x="70" y="388" text-anchor="middle" font-size="13">value 6</text>
<text x="192" y="328" text-anchor="middle" font-size="12">T1</text>
<rect x="146" y="338" width="92" height="64" rx="6" fill="#f8d9e7" stroke="#68798b"/>
<text x="192" y="366" text-anchor="middle" font-size="19">2</text>
<text x="192" y="388" text-anchor="middle" font-size="13">value 3</text>
<text x="314" y="328" text-anchor="middle" font-size="12">T2</text>
<rect x="268" y="338" width="92" height="64" rx="6" fill="#ffe3cf" stroke="#68798b"/>
<text x="314" y="366" text-anchor="middle" font-size="19">17</text>
<text x="314" y="388" text-anchor="middle" font-size="13">value 5</text>
<text x="436" y="328" text-anchor="middle" font-size="12">T3</text>
<rect x="390" y="338" width="92" height="64" rx="6" fill="#d3eff6" stroke="#68798b"/>
<text x="436" y="366" text-anchor="middle" font-size="19">18</text>
<text x="436" y="388" text-anchor="middle" font-size="13">value 1</text>
<text x="558" y="328" text-anchor="middle" font-size="12">T4</text>
<rect x="512" y="338" width="92" height="64" rx="6" fill="#e0e7ef" stroke="#68798b"/>
<text x="558" y="366" text-anchor="middle" font-size="19">18</text>
<text x="558" y="388" text-anchor="middle" font-size="13">value 7</text>
<text x="680" y="328" text-anchor="middle" font-size="12">T5</text>
<rect x="634" y="338" width="92" height="64" rx="6" fill="#fff0c9" stroke="#68798b"/>
<text x="680" y="366" text-anchor="middle" font-size="19">33</text>
<text x="680" y="388" text-anchor="middle" font-size="13">value 2</text>
<text x="802" y="328" text-anchor="middle" font-size="12">T6</text>
<rect x="756" y="338" width="92" height="64" rx="6" fill="#e2f0cb" stroke="#68798b"/>
<text x="802" y="366" text-anchor="middle" font-size="19">35</text>
<text x="802" y="388" text-anchor="middle" font-size="13">value 0</text>
<text x="924" y="328" text-anchor="middle" font-size="12">T7</text>
<rect x="878" y="338" width="92" height="64" rx="6" fill="#e7dff4" stroke="#68798b"/>
<text x="924" y="366" text-anchor="middle" font-size="19">35</text>
<text x="924" y="388" text-anchor="middle" font-size="13">value 4</text>
<text x="24" y="446" font-size="14">Equal keys 18 and 35 retain the order of their associated original positions. Inputs stay unchanged.</text>
</g>
</svg>
