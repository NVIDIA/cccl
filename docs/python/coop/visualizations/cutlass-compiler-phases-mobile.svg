<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cutlass-phases-overview-title cutlass-phases-overview-desc" viewBox="0 0 270 1726">
  <title id="cutlass-phases-overview-title">Compiler phases: overview</title>
  <desc id="cutlass-phases-overview-desc">Read from top to bottom. CuTe traces symbolic calls. cuda.coop finalizes the provider bundle inside the CuTe hook. CuTe then compiles and links the kernel.</desc>
  <defs>
    <marker id="cutlass-phases-overview-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#44556b"/>
    </marker>
  </defs>
  <rect width="270" height="1726" fill="#ffffff"/>
  <text x="8" y="22" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">1. Trace the kernel</text>
  <g data-node="Python with symbolic values → typed IR" role="group" aria-label="CuTe compiler. Python with symbolic values → typed IR. CuTe traces the kernel and its control flow.. Cooperative calls emit IR during tracing.">
    <rect x="8" y="36.400000000000006" width="254" height="156.4" rx="7" fill="#e9f2fb" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="66.80000000000001" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Python with symbolic values →</text>
    <text x="20" y="89.20000000000002" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">typed IR</text>
    <text x="20" y="111.60000000000002" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">CuTe traces the kernel and its</text>
    <text x="20" y="134.00000000000003" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">control flow.</text>
    <text x="20" y="156.40000000000003" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Cooperative calls emit IR during</text>
    <text x="20" y="178.80000000000004" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">tracing.</text>
  </g>
  <path d="M135 195.8V220.8" marker-end="url(#cutlass-phases-overview-arrow)" fill="none" stroke="#44556b" stroke-width="1.5"/>
  <text x="8" y="248.8" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">2. Plan each call</text>
  <g data-node="Select the provider and its ABI" role="group" aria-label="cuda.coop. Select the provider and its ABI. Use value types, controls, and exact launch facts.. Use CUB. Derive the provider symbol.">
    <rect x="8" y="263.2" width="254" height="134" rx="7" fill="#e5f1d7" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="293.59999999999997" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Select the provider and its ABI</text>
    <text x="20" y="315.99999999999994" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Use value types, controls, and exact</text>
    <text x="20" y="338.3999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">launch facts.</text>
    <text x="20" y="360.7999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Use CUB. Derive the</text>
    <text x="20" y="383.1999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">provider symbol.</text>
  </g>
  <path d="M135 400.2V425.2" marker-end="url(#cutlass-phases-overview-arrow)" fill="none" stroke="#44556b" stroke-width="1.5"/>
  <text x="8" y="453.2" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">3. Emit calls and collect requests</text>
  <g data-node="Emit symbolic calls; keep provider requests" role="group" aria-label="cuda.coop. Emit symbolic calls; keep provider requests. Each call names its provider before LTO-IR exists.. Keep distinct requests in the trace's session.. Record scratch uses with temporary operands when needed.">
    <rect x="8" y="467.59999999999997" width="254" height="201.20000000000002" rx="7" fill="#e5f1d7" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="497.99999999999994" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Emit symbolic calls; keep provider</text>
    <text x="20" y="520.4" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">requests</text>
    <text x="20" y="542.8" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Each call names its provider before</text>
    <text x="20" y="565.1999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">LTO-IR exists.</text>
    <text x="20" y="587.5999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Keep distinct requests in the trace's</text>
    <text x="20" y="609.9999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">session.</text>
    <text x="20" y="632.3999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Record scratch uses with temporary</text>
    <text x="20" y="654.7999999999998" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">operands when needed.</text>
  </g>
  <path d="M135 671.8V696.8" marker-end="url(#cutlass-phases-overview-arrow)" fill="none" stroke="#44556b" stroke-width="1.5"/>
  <text x="8" y="724.8" font-family="sans-serif" font-size="12px" font-weight="400" fill="#44556b">Tracing complete · finalize providers before</text>
  <text x="8" y="745.8" font-family="sans-serif" font-size="12px" font-weight="400" fill="#44556b">kernel compilation</text>
  <text x="8" y="776.8" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">4. Finalize the provider bundle</text>
  <g data-node="Compile or reuse the completed bundle" role="group" aria-label="cuda.coop. Compile or reuse the completed bundle. After tracing, render one C++ unit for the session.. On a cache miss, NVRTC returns provider LTO-IR.. The same program supplies any scratch layouts.">
    <rect x="8" y="791.1999999999999" width="254" height="201.20000000000002" rx="7" fill="#e5f1d7" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="821.5999999999999" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Compile or reuse the completed</text>
    <text x="20" y="843.9999999999999" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">bundle</text>
    <text x="20" y="866.3999999999999" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">After tracing, render one C++ unit for</text>
    <text x="20" y="888.7999999999998" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">the session.</text>
    <text x="20" y="911.1999999999998" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">On a cache miss, NVRTC returns</text>
    <text x="20" y="933.5999999999998" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">provider LTO-IR.</text>
    <text x="20" y="955.9999999999998" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">The same program supplies any</text>
    <text x="20" y="978.3999999999997" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">scratch layouts.</text>
  </g>
  <path d="M135 995.4V1020.4" marker-end="url(#cutlass-phases-overview-arrow)" fill="none" stroke="#44556b" stroke-width="1.5"/>
  <text x="8" y="1048.4" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">5. Resolve deferred scratch</text>
  <g data-node="Resolve scratch; attach the provider link input" role="group" aria-label="cuda.coop. Resolve scratch; attach the provider link input. For deferred uses, apply the C++ sizes and alignments.. Allocate at kernel entry. Bind each call to its slice.. Attach the LTO-IR path to gpu.module link-libraries.">
    <rect x="8" y="1062.8000000000002" width="254" height="201.20000000000002" rx="7" fill="#e5f1d7" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="1093.2000000000003" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Resolve scratch; attach the provider</text>
    <text x="20" y="1115.6000000000004" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">link input</text>
    <text x="20" y="1138.0000000000005" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">For deferred uses, apply the C++</text>
    <text x="20" y="1160.4000000000005" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">sizes and alignments.</text>
    <text x="20" y="1182.8000000000006" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Allocate at kernel entry. Bind each</text>
    <text x="20" y="1205.2000000000007" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">call to its slice.</text>
    <text x="20" y="1227.6000000000008" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Attach the LTO-IR path to</text>
    <text x="20" y="1250.000000000001" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">gpu.module link-libraries.</text>
  </g>
  <path d="M135 1267.0000000000002V1292.0000000000002" marker-end="url(#cutlass-phases-overview-arrow)" fill="none" stroke="#44556b" stroke-width="1.5"/>
  <text x="8" y="1320.0000000000002" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">6. Compile and link the kernel</text>
  <g data-node="Completed kernel IR + provider LTO-IR → cubin" role="group" aria-label="CuTe compiler. Completed kernel IR + provider LTO-IR → cubin. Hash and build the module after the finalization hook.. Merge gpu.module link-libraries into LinkLibraries; compile.. nvJitLink resolves provider symbols. LTO can inline them.">
    <rect x="8" y="1334.4000000000003" width="254" height="201.20000000000002" rx="7" fill="#e9f2fb" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="1364.8000000000004" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Completed kernel IR + provider</text>
    <text x="20" y="1387.2000000000005" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">LTO-IR → cubin</text>
    <text x="20" y="1409.6000000000006" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Hash and build the module after the</text>
    <text x="20" y="1432.0000000000007" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">finalization hook.</text>
    <text x="20" y="1454.4000000000008" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Merge gpu.module link-libraries into</text>
    <text x="20" y="1476.8000000000009" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">LinkLibraries; compile.</text>
    <text x="20" y="1499.200000000001" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">nvJitLink resolves provider symbols.</text>
    <text x="20" y="1521.600000000001" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">LTO can inline them.</text>
  </g>
  <path d="M135 1538.6000000000004V1563.6000000000004" marker-end="url(#cutlass-phases-overview-arrow)" fill="none" stroke="#44556b" stroke-width="1.5"/>
  <text x="8" y="1591.6000000000004" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">7. Load and launch</text>
  <g data-node="Load the device binary; obtain the kernel entry" role="group" aria-label="CuTe compiler. Load the device binary; obtain the kernel entry. Launch the compiled kernel.. Reuse it on later calls.">
    <rect x="8" y="1606.0000000000005" width="254" height="111.60000000000001" rx="7" fill="#e9f2fb" stroke="#68798b" stroke-width="1"/>
    <text x="20" y="1636.4000000000005" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">Load the device binary; obtain the</text>
    <text x="20" y="1658.8000000000006" font-family="sans-serif" font-size="14px" font-weight="500" fill="#172b3a">kernel entry</text>
    <text x="20" y="1681.2000000000007" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Launch the compiled kernel.</text>
    <text x="20" y="1703.6000000000008" font-family="sans-serif" font-size="14px" font-weight="400" fill="#172b3a">Reuse it on later calls.</text>
  </g>
</svg>
