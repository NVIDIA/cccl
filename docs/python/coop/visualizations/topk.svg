<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Block TopK selects an unordered prefix of key/value pairs</title>
<desc id="desc">Eight threads each own two blocked items. The first twelve keys are valid. For k equal to four, one permitted maximum selection has keys 11, 14, 9, 12 and original positions 8, 6, 4, 2. Only the first four returned slots are defined; all remaining slots are unspecified. Inputs stay unchanged.</desc>
