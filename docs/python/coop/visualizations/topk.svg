<text x="26" y="34" font-size="21" text-anchor="start" font-weight="600">Block TopK maximum pairs</text>
<text x="26" y="60" font-size="14" text-anchor="start">8 threads · 2 items per thread · k = 4 · valid_items = 12 · defined output = min(4, 12) = 4</text>
<text x="26" y="94" font-size="16" text-anchor="start" font-weight="600">Input payloads remain unchanged</text>
