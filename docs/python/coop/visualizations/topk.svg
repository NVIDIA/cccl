<text x="26" y="254" font-size="14" text-anchor="start">Illustrative filtering: count digit buckets; retain better keys and refine the boundary bucket.</text>
<text x="26" y="280" font-size="14" text-anchor="start">Gather four selected pairs into blocked positions 0–3. Tied-key choices and output order are unspecified.</text>
<text x="26" y="505" font-size="15" text-anchor="start" font-weight="600">Read or store only the defined prefix. Every ? lies outside min(k, valid_items).</text>
<text x="26" y="532" font-size="14" text-anchor="start">Teaching example of the selection contract; no full sort or exact CUB instruction trace is shown.</text>
