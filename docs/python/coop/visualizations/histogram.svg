<title id="title">Fresh histogram counts with striped bin ownership</title>
<desc id="desc">Eight threads contribute two samples each. Thirteen bins have counts 2, 1, 1, 2, 1, 1, 2, 0, 1, 2, 1, 1, 1. Each thread receives two striped counters; bins thirteen through fifteen are output padding with count zero. Inputs stay unchanged.</desc>
