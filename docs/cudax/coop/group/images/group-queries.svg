  text { font-family: Arial, Helvetica, sans-serif; fill: #172b3a; }
  .heading { font-size: 24px; font-weight: 700; }
  .subtitle { font-size: 18px; fill: #526373; }
  .label { font-size: 17px; }
  .note { font-size: 20px; font-weight: 700; }
  .thread { fill: #e3e9ef; stroke: #9eacb9; stroke-width: 1.2; }
  .member { fill: #76b900; stroke: #3e6500; stroke-width: 1.5; }
  .block { fill: #f8fafc; stroke: #a8b5c1; stroke-width: 1.5; }
  .boundary { fill: none; stroke: #266a9e; stroke-width: 2.5; stroke-dasharray: 7 5; }
  .warp { fill: none; stroke: #a8b5c1; stroke-width: 1.5; }
  .current-warp { fill: #edf7da; stroke: #3e6500; stroke-width: 2; }
  .callout { fill: none; stroke: #3e6500; stroke-width: 2; }
</style>
