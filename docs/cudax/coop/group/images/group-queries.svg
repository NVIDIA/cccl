<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title description">
<title id="title">Thread and warp rank queries within a block</title>
<desc id="description">Two panels each show one block containing four 32-thread warps. The group contains the first three warps; the fourth warp is outside the group. Thread 75, in the third warp, is highlighted in green. CTK Cooperative Groups group threads within the block level and expose the thread rank within the three-warp group. CCCL Cooperative Groups group warps within the block level and expose both thread rank 75 and warp rank 2 within the same group. Ranks start at zero.</desc>
