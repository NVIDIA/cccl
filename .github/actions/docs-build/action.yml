name: "CCCL Docs Build/Upload"
description: "Builds the docs and uploads them as workflow artifacts."

inputs:
  upload_workflow_artifact:
    description: "Uploads the built docs as a workflow artifact (actions/upload-artifact)."
    required: false
    default: "true"


runs:
  using: "composite"
  steps:
    # registry.py imports PyYAML, so the docs environment is created before
    # anything reads the registry. The build scripts reuse this venv, and the
    # runner's system Python is left alone.
    - name: Set up the docs environment
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        python3 -m venv docs/env
        docs/env/bin/python -m pip install --quiet -r docs/requirements.txt

    # The deploy's assembly, minus seeding from and publishing to gh-pages: every
    # product in docs/registry.yml plus the root project, which holds the
    # contributor and maintainer docs. Warnings are errors throughout.
    - name: Build all docs
      shell: bash --noprofile --norc -euo pipefail {0}
      run: docs/env/bin/python docs/build_site.py

    # Update docs as workflow artifact:
    - name: Upload artifact
      if: ${{ inputs.upload_workflow_artifact == 'true' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: docs
        path: docs/_site/
        compression-level: 0
