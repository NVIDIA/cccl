name: "CCCL CI Failure Analysis"
description: "Analyze failed jobs from a selected GitHub Actions workflow run."

# Caller contract:
# - Grant `actions: read`, `checks: read`, and `contents: read`; add
#   `pull-requests: read` when `pr_number` is provided.
# - Finish the relevant target jobs before invoking the action.
# - Consume the runner-local `analysis_file` output before the job ends.
inputs:
  inference_api_key:
    description: "NVIDIA Inference Hub API key."
    required: true
  run_id:
    description: "Workflow run in this repository to analyze."
    required: true
  pr_number:
    description: "Optional pull request corresponding to the run, for collecting its diff."
    required: false
    default: ""

outputs:
  analysis_file:
    description: "Runner-local normalized analysis JSON file."
    value: ${{ steps.assemble-analysis.outputs.analysis_file }}

runs:
  using: "composite"
  steps:
    - name: Collect workflow logs
      id: collect-logs
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        RUN_ID: ${{ inputs.run_id }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        "${GITHUB_ACTION_PATH}/collect-logs.sh" \
          /tmp/ci-logs \
          "${RUN_ID}" \
          "${PR_NUMBER}"
        has_evidence="$(jq 'any(.[]; .log_path != "" or (.annotations | length > 0))' /tmp/ci-logs/jobs.json)"
        echo "has_evidence=${has_evidence}" >> "${GITHUB_OUTPUT}"

    - name: Prepare analysis environment
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        mkdir -p \
          "${RUNNER_TEMP}/codex-home" \
          "${RUNNER_TEMP}/ci-failure-analysis"
        cp "${GITHUB_ACTION_PATH}/config.toml" "${RUNNER_TEMP}/codex-home/config.toml"

    - name: Investigate the workflow run
      if: ${{ steps.collect-logs.outputs.has_evidence == 'true' }}
      uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
      env:
        CI_LOG_DIR: /tmp/ci-logs
      with:
        openai-api-key: ${{ inputs.inference_api_key }}
        responses-api-endpoint: https://inference-api.nvidia.com/v1/responses
        codex-version: 0.149.0
        codex-home: ${{ runner.temp }}/codex-home
        permission-profile: ci_triage
        safety-strategy: drop-sudo
        allow-bot-users: "copy-pr-bot[bot]"
        # Scheduled workflows have no meaningful triggering user, so skip the actor check.
        allow-users: ${{ github.event_name == 'schedule' && '*' || '' }}
        model: openai/openai/gpt-5.6-sol
        effort: high
        codex-args: --strict-config --ephemeral
        output-file: ${{ runner.temp }}/ci-failure-analysis/model-output.json
        output-schema-file: ${{ github.action_path }}/../../../ci/util/ci_failure_analysis/model-output.schema.json
        prompt-file: ${{ github.action_path }}/failure_triage_prompt.md

    - name: Assemble normalized analysis
      id: assemble-analysis
      env:
        HAS_EVIDENCE: ${{ steps.collect-logs.outputs.has_evidence }}
        MODEL_OUTPUT_FILE: ${{ runner.temp }}/ci-failure-analysis/model-output.json
        ANALYSIS_FILE: ${{ runner.temp }}/ci-failure-analysis/analysis.json
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        model_output_file="${MODEL_OUTPUT_FILE}"
        if [[ "${HAS_EVIDENCE}" == "false" ]]; then
          model_output_file=/dev/null
        fi
        jq --null-input \
          --argjson has_evidence "${HAS_EVIDENCE}" \
          --slurpfile model_output "${model_output_file}" \
          --slurpfile run /tmp/ci-logs/run.json \
          --slurpfile jobs /tmp/ci-logs/jobs.json \
          '{
            run: {
              id: $run[0].id,
              number: $run[0].run_number
            },
            jobs: [
              $jobs[0][] |
              {id, name}
            ],
            groups: (if $has_evidence then $model_output[0].groups else [] end),
            missing_log_job_count: ([$jobs[0][] | select(.log_path == "")] | length),
            analysis_skipped: ($has_evidence | not)
          }' > "${ANALYSIS_FILE}"
        test -s "${ANALYSIS_FILE}"
        echo "analysis_file=${ANALYSIS_FILE}" >> "${GITHUB_OUTPUT}"
