name: "CCCL CI Failure Analysis"
description: "Collect failed GitHub Actions logs and produce a schema-validated AI analysis."

inputs:
  inference_api_key:
    description: "NVIDIA Inference Hub API key."
    required: true
  pr_number:
    description: "Optional pull request number for collecting its diff."
    required: false
    default: ""

outputs:
  markdown:
    description: "Rendered Markdown failure analysis."
    value: ${{ steps.export-analysis.outputs.markdown }}

runs:
  using: "composite"
  steps:
    - name: Collect workflow logs
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        "${GITHUB_ACTION_PATH}/collect-logs.sh" \
          /tmp/ci-logs \
          "${{ inputs.pr_number }}"

    - name: Configure agent permissions
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        mkdir -p "${RUNNER_TEMP}/codex-home"
        cp "${GITHUB_ACTION_PATH}/config.toml" "${RUNNER_TEMP}/codex-home/config.toml"
        cp "${GITHUB_ACTION_PATH}/model-catalog.json" /tmp/ci-logs/model-catalog.json

    - name: Investigate the workflow run
      uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
      env:
        CI_LOG_DIR: /tmp/ci-logs
      with:
        openai-api-key: ${{ inputs.inference_api_key }}
        responses-api-endpoint: https://inference-api.nvidia.com/v1/responses
        codex-version: 0.144.5
        codex-home: ${{ runner.temp }}/codex-home
        permission-profile: ci_triage
        allow-bot-users: "copy-pr-bot[bot]"
        model: openai/openai/gpt-5.5
        effort: medium
        codex-args: --ignore-rules --ephemeral
        output-file: ${{ runner.temp }}/agent-analysis.json
        output-schema-file: ${{ github.action_path }}/output.schema.json
        prompt-file: ${{ github.action_path }}/prompt.md

    - name: Validate and render failure analysis
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        python3 "${GITHUB_ACTION_PATH}/render.py" \
          --analysis "${RUNNER_TEMP}/agent-analysis.json" \
          --schema "${GITHUB_ACTION_PATH}/output.schema.json" \
          --jobs /tmp/ci-logs/jobs.json \
          --repository "${GITHUB_REPOSITORY}" \
          --run-id "${GITHUB_RUN_ID}" \
          --head-sha "${GITHUB_SHA}" \
          --output "${RUNNER_TEMP}/agent-summary.md"

    - name: Export failure analysis
      id: export-analysis
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        test -s "${RUNNER_TEMP}/agent-summary.md"
        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "markdown<<${delimiter}"
          cat "${RUNNER_TEMP}/agent-summary.md"
          printf '\n%s\n' "${delimiter}"
        } >> "${GITHUB_OUTPUT}"
