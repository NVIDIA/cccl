name: "CCCL CI Failure Analysis"
description: "Analyze failed jobs from a selected GitHub Actions workflow run."

# Caller contract:
# - Grant `actions: read` and `contents: read`; add `pull-requests: read` when
#   `pr_number` is provided.
# - Finish the relevant target jobs before invoking the action.
# - Check out the target run's source revision before invoking the action.
inputs:
  inference_api_key:
    description: "NVIDIA Inference Hub API key."
    required: true
  run_id:
    description: "Workflow run in this repository to analyze."
    required: true
  pr_number:
    description: "Optional pull request corresponding to the run, for collecting its diff."
    required: false
    default: ""

outputs:
  markdown:
    description: "Rendered Markdown failure analysis."
    value: ${{ steps.export-analysis.outputs.markdown }}

runs:
  using: "composite"
  steps:
    - name: Collect workflow logs
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        RUN_ID: ${{ inputs.run_id }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        "${GITHUB_ACTION_PATH}/collect-logs.sh" \
          /tmp/ci-logs \
          "${RUN_ID}" \
          "${PR_NUMBER}"

    - name: Verify source revision
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        expected_sha="$(jq -er '.head_sha | select(test("^[0-9a-f]{40}$"))' /tmp/ci-logs/run.json)"
        actual_sha="$(git -C "${GITHUB_WORKSPACE}" rev-parse HEAD)"
        if [[ "${actual_sha}" != "${expected_sha}" ]]; then
          echo "Checked out revision ${actual_sha} does not match target run revision ${expected_sha}." >&2
          exit 1
        fi

    - name: Configure agent permissions
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        mkdir -p "${RUNNER_TEMP}/codex-home"
        cp "${GITHUB_ACTION_PATH}/config.toml" "${RUNNER_TEMP}/codex-home/config.toml"

    - name: Investigate the workflow run
      uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
      env:
        CI_LOG_DIR: /tmp/ci-logs
      with:
        openai-api-key: ${{ inputs.inference_api_key }}
        responses-api-endpoint: https://inference-api.nvidia.com/v1/responses
        codex-version: 0.144.5
        codex-home: ${{ runner.temp }}/codex-home
        permission-profile: ci_triage
        safety-strategy: drop-sudo
        allow-bot-users: "copy-pr-bot[bot]"
        model: gpt-5.5
        effort: medium
        codex-args: --strict-config --ignore-rules --ephemeral
        output-file: ${{ runner.temp }}/agent-analysis.json
        output-schema-file: ${{ github.action_path }}/output.schema.json
        prompt-file: ${{ github.action_path }}/prompt.md

    - name: Validate and render failure analysis
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        python3 "${GITHUB_ACTION_PATH}/render.py" \
          --analysis "${RUNNER_TEMP}/agent-analysis.json" \
          --schema "${GITHUB_ACTION_PATH}/output.schema.json" \
          --jobs /tmp/ci-logs/jobs.json \
          --repository "${GITHUB_REPOSITORY}" \
          --run-id "$(jq -er '.id | tostring' /tmp/ci-logs/run.json)" \
          --head-sha "$(jq -er '.head_sha' /tmp/ci-logs/run.json)" \
          --output "${RUNNER_TEMP}/agent-summary.md"

    - name: Export failure analysis
      id: export-analysis
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        test -s "${RUNNER_TEMP}/agent-summary.md"
        delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "markdown<<${delimiter}"
          cat "${RUNNER_TEMP}/agent-summary.md"
          printf '\n%s\n' "${delimiter}"
        } >> "${GITHUB_OUTPUT}"
