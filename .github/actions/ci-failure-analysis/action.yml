name: "CCCL CI Failure Analysis"
description: "Analyze failed jobs from a selected GitHub Actions workflow run."

# Caller contract:
# - Grant `actions: read` and `contents: read`; add `pull-requests: read` when
#   `pr_number` is provided.
# - Finish the relevant target jobs before invoking the action.
# - Inject a runner-local `output_dir` as the action's working directory.
inputs:
  inference_api_key:
    description: "NVIDIA Inference Hub API key."
    required: true
  run_id:
    description: "Workflow run in this repository to analyze."
    required: true
  output_dir:
    description: "Runner-local working directory."
    required: true
  pr_number:
    description: "Optional pull request corresponding to the run, for collecting its diff."
    required: false
    default: ""

outputs:
  github_report:
    description: "Full failure analysis report for GitHub."
    value: ${{ steps.export-analysis.outputs.github_report }}
  slack_summary:
    description: "Abbreviated failure analysis summary for Slack."
    value: ${{ steps.export-analysis.outputs.slack_summary }}

runs:
  using: "composite"
  steps:
    - name: Collect workflow logs
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        RUN_ID: ${{ inputs.run_id }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        "${GITHUB_ACTION_PATH}/collect-logs.sh" \
          /tmp/ci-logs \
          "${RUN_ID}" \
          "${PR_NUMBER}"

    - name: Prepare analysis environment
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        mkdir -p "${RUNNER_TEMP}/codex-home" "${OUTPUT_DIR}"
        cp "${GITHUB_ACTION_PATH}/config.toml" "${RUNNER_TEMP}/codex-home/config.toml"

    - name: Investigate the workflow run
      uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
      env:
        CI_LOG_DIR: /tmp/ci-logs
      with:
        openai-api-key: ${{ inputs.inference_api_key }}
        responses-api-endpoint: https://inference-api.nvidia.com/v1/responses
        codex-version: 0.144.5
        codex-home: ${{ runner.temp }}/codex-home
        permission-profile: ci_triage
        safety-strategy: drop-sudo
        allow-bot-users: "copy-pr-bot[bot]"
        model: openai/openai/gpt-5.6-sol
        effort: medium
        codex-args: --strict-config --ignore-rules --ephemeral
        output-file: ${{ inputs.output_dir }}/analysis.json
        output-schema-file: ${{ github.action_path }}/output.schema.json
        prompt-file: ${{ github.action_path }}/failure_triage_prompt.md

    - name: Assemble analysis context
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        cp /tmp/ci-logs/run.json "${OUTPUT_DIR}/run.json"
        cp /tmp/ci-logs/jobs.json "${OUTPUT_DIR}/jobs.json"

    - name: Render failure analysis outputs
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        python3 "${GITHUB_ACTION_PATH}/render.py" \
          --analysis-dir "${OUTPUT_DIR}" \
          --repository "${GITHUB_REPOSITORY}" \
          --github-report-output "${OUTPUT_DIR}/github-report.md" \
          --slack-summary-output "${OUTPUT_DIR}/slack-summary.txt"

    - name: Export failure analysis outputs
      id: export-analysis
      env:
        OUTPUT_DIR: ${{ inputs.output_dir }}
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        test -s "${OUTPUT_DIR}/github-report.md"
        test -s "${OUTPUT_DIR}/slack-summary.txt"
        github_report_delimiter="EOF_$(openssl rand -hex 16)"
        slack_summary_delimiter="EOF_$(openssl rand -hex 16)"
        {
          echo "github_report<<${github_report_delimiter}"
          cat "${OUTPUT_DIR}/github-report.md"
          echo "${github_report_delimiter}"
          echo "slack_summary<<${slack_summary_delimiter}"
          cat "${OUTPUT_DIR}/slack-summary.txt"
          echo "${slack_summary_delimiter}"
        } >> "${GITHUB_OUTPUT}"
