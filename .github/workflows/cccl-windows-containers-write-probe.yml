name: Verify Windows container package write access

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Push package permission probe
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/nvidia/cccl-windows-containers
      PROBE_TAG: permission-probe-${{ github.run_id }}
    steps:
      - name: Require internal package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(
            gh api /orgs/NVIDIA/packages/container/cccl-windows-containers \
              --jq '.visibility'
          )" = internal

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push permission probe
        run: |
          docker pull "${IMAGE}:bootstrap"
          docker tag "${IMAGE}:bootstrap" "${IMAGE}:${PROBE_TAG}"
          docker push "${IMAGE}:${PROBE_TAG}"

      - name: Verify evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(
            gh api /orgs/NVIDIA/packages/container/cccl-windows-containers \
              --jq '.visibility'
          )" = internal
          gh api \
            '/orgs/NVIDIA/packages/container/cccl-windows-containers/versions?per_page=100' \
            --jq '.[].metadata.container.tags[]' \
            | grep -Fx -- "${PROBE_TAG}"
