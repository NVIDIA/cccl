name: GHCR Windows devcontainers E2E

on:
  push:
    branches:
      - codex/ghcr-windows-e2e

permissions: {}

jobs:
  publish:
    if: false
    permissions:
      contents: read
      packages: write
    uses: rapidsai/devcontainers/.github/workflows/release-windows.yml@f0d3eebdef13157c4f6bd5ae8462c0194beac82f
    with:
      repo: ghcr.io/nvidia/cccl-devcontainers-pr760-e2e

  cleanup:
    name: Delete disposable package
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method DELETE \
            /orgs/NVIDIA/packages/container/cccl-devcontainers-pr760-e2e
