name: GHCR Windows devcontainers E2E

on:
  push:
    branches:
      - codex/ghcr-windows-e2e

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: rapidsai/devcontainers/.github/workflows/release-windows.yml@f0d3eebdef13157c4f6bd5ae8462c0194beac82f
    with:
      repo: ghcr.io/nvidia/cccl-devcontainers-pr760-e2e

  verify:
    name: Verify package
    needs: publish
    permissions:
      packages: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify private package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          package="/orgs/NVIDIA/packages/container/cccl-devcontainers-pr760-e2e"
          visibility="$(gh api "$package" --jq .visibility)"
          repository="$(gh api "$package" --jq .repository.full_name)"
          tags="$(gh api "$package/versions?per_page=100" --jq '[.[].metadata.container.tags[]]')"

          test "$visibility" = "private"
          test "$repository" = "NVIDIA/cccl"
          test "$(jq length <<<"$tags")" -eq 28
          test "$(jq '[.[] | select(endswith("-windows2022"))] | length' <<<"$tags")" -eq 14
          test "$(jq '[.[] | select(startswith("latest-"))] | length' <<<"$tags")" -eq 0
          echo "Verified private package linked to $repository with 28 versioned tags."
