name: Source Custom Matrix

on:
  workflow_dispatch:
    inputs:
      matrix_branch:
        description: "Branch (in this repo) containing the CI matrix file to sideload."
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}

jobs:
  ci:
    name: Run custom CI matrix
    permissions:
      contents: read
      id-token: write
    uses: NVIDIA/cccl/.github/workflows/ci-matrix-build.yml@ci
    secrets: inherit
    with:
      workflows: nightly
      source_ref: ${{ github.sha }}
      matrix_ref: ${{ inputs.matrix_branch }}
