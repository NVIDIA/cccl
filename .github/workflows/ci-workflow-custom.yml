# On-demand workflow that runs the requested full build matrices from a
# configurable ref and path in this repo (no inspect-changes).
name: custom

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      workflows:
        description: "Space separated list of workflows in the matrix file to run."
        type: string
        required: false
        default: nightly
      matrix_ref:
        description: "Commit SHA or ref in this repo containing the CI matrix (defaults to the triggering commit)."
        type: string
        required: false
      matrix_path:
        description: "Path to the CI matrix file, relative to the repository root."
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}

jobs:

  matrix-build:
    name: Build & dispatch CI matrix
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/ci-matrix-build.yml
    secrets: inherit
    with:
      workflows: ${{ inputs.workflows }}
      ci_profile: ""
      matrix_ref: ${{ inputs.matrix_ref }}
      matrix_path: ${{ inputs.matrix_path }}
