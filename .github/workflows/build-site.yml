# Builds the docs site and publishes it to the gh-pages branch.
#
# A push to main rebuilds every product in docs/registry.yml as "unstable".
# Running the workflow by hand with a release tag (v3.5.0, python-1.2.0) builds
# that product at that version. Each run starts from the site already on
# gh-pages, so published versions are kept, and replaces the branch with a
# single commit.
name: Build documentation site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      git-tag:
        description: "Release tag to publish, e.g. v3.5.0. Leave blank to publish every product as unstable."
        required: false
        type: string
        default: ""
      source-ref:
        description: "Ref to build from, if not the tag itself. Use it for tags that predate this workflow."
        required: false
        type: string
        default: ""
      docs-branch:
        description: "Branch to publish to: gh-pages, or gh-pages-<name> for a test run."
        required: false
        type: string
        default: gh-pages

# Each run starts from the current gh-pages, so two runs at once would lose one
# run's changes. Run one at a time per branch. While one runs, GitHub keeps only
# the newest waiting run, so a waiting release run can be cancelled by a later
# push and must then be started again.
concurrency:
  group: docs-publish-${{ inputs.docs-branch || 'gh-pages' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ github.repository == 'NVIDIA/cccl' && 'linux-amd64-cpu32' || 'ubuntu-latest' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          ref: ${{ inputs.source-ref || inputs.git-tag || github.sha }}
          persist-credentials: false

      # build_site.py needs PyYAML, so create the venv before running it.
      - name: Set up the docs environment
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          python3 -m venv docs/env
          docs/env/bin/python -m pip install --quiet -r docs/requirements.txt

      - name: Resolve what to build
        id: plan
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          GIT_TAG: ${{ inputs.git-tag }}
          DOCS_BRANCH: ${{ inputs.docs-branch || 'gh-pages' }}
        run: |
          # The publish step replaces the whole branch, so only allow gh-pages branches.
          if [[ ! "${DOCS_BRANCH}" =~ ^gh-pages(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "error: docs-branch must be gh-pages or gh-pages-<name>, got '${DOCS_BRANCH}'." >&2
            exit 1
          fi
          echo "branch=${DOCS_BRANCH}" >> "${GITHUB_OUTPUT}"

          # GitHub Pages serves the site at <owner>.github.io/<repo>, with the owner in lowercase.
          owner="$(printf '%s' "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          echo "site_url=https://${owner}.github.io/${GITHUB_REPOSITORY#*/}" >> "${GITHUB_OUTPUT}"

          if [[ -z "${GIT_TAG}" ]]; then
            echo "label=unstable" >> "${GITHUB_OUTPUT}"
            echo "product=" >> "${GITHUB_OUTPUT}"
          else
            docs/env/bin/python - "${GIT_TAG}" >> "${GITHUB_OUTPUT}" <<'PY'
          import sys
          sys.path.insert(0, "docs")
          import registry
          key, version = registry.resolve_tag(sys.argv[1])
          print(f"label={version}")
          print(f"product={key}")
          PY
          fi

      - name: Fetch the published site
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          if ! git fetch --depth=1 origin \
                 "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"; then
            # A missing branch only means this is the first deploy. Any other
            # failure has to stop the run, or the published versions would be
            # lost. git ls-remote exits with 2 only when the remote answers that
            # the branch does not exist.
            status=0
            git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1 || status=$?
            if [[ "${status}" -ne 2 ]]; then
              echo "error: could not fetch ${BRANCH} (git ls-remote exit code ${status})." >&2
              exit 1
            fi
            echo "${BRANCH} does not exist yet; this is the first deploy."
          fi

      - name: Build the site
        shell: bash --noprofile --norc -euo pipefail {0}
        env:
          CCCL_DOCS_SITE_URL: ${{ steps.plan.outputs.site_url }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          LABEL: ${{ steps.plan.outputs.label }}
          PRODUCT: ${{ steps.plan.outputs.product }}
        run: |
          args=(--label "${LABEL}" --published-branch "origin/${BRANCH}")
          if [[ -n "${PRODUCT}" ]]; then
            args+=(--product "${PRODUCT}")
          fi
          docs/env/bin/python docs/build_site.py "${args[@]}"

      # force_orphan replaces the branch with one commit, which keeps it small.
      # Nothing is lost, because the site was built on top of the published one.
      - name: Publish
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: ${{ steps.plan.outputs.branch }}
          publish_dir: docs/_site
          destination_dir: docs
          force_orphan: true
