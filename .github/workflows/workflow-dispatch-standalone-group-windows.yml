name: "Workflow/Dispatch/StandaloneGroup/Windows"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_call:
    inputs:
      job-array:
        description: "The dispatch.json's windows_standalone.jobs.<name> array of dispatch jobs."
        type: string
        required: true
      repo:
        description: "Repository to checkout."
        type: string
        required: false
        default: ${{ github.repository }}
      commit:
        description: "Commit SHA or branch/ref to checkout."
        type: string
        required: false
        default: ${{ github.sha }}

jobs:
  run-jobs:
    name: "${{ matrix.name }}"
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.job-array) }}
    permissions:
      id-token: write
      contents: read
    runs-on: ${{ (github.repository_owner == 'NVIDIA' || github.repository_owner == 'NVIDIA-dev') && matrix.runner || 'windows-latest' }}
    steps:
      - name: Run job
        uses: $/.github/actions/workflow-run-job-windows
        with:
          source_repo: ${{ inputs.repo }}
          source_ref: ${{ inputs.commit }}
          id:          ${{ matrix.id }}
          environment: ${{ matrix.environment }}
          command:     ${{ matrix.command }}
          image:       ${{ matrix.image }}
          runner:      ${{ matrix.runner }}
          cuda:        ${{ matrix.cuda }}
          host:        ${{ matrix.host }}
          gpu_count:   ${{ matrix.gpu_count }}
