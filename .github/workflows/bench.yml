name: Benchmark Compare

on:
  workflow_dispatch:
    inputs:
      gpu:
        description: "GPU selector. Ex: 'rtxa6000'. See ci/bench.yaml for all options."
        required: true
        default: "rtxa6000"
        type: string
      launch_args:
        description: "Devcontainer launch args. Ex: '--cuda 13.3 --host gcc14'"
        required: false
        default: "--cuda 13.3 --host gcc14"
        type: string
      arch:
        description: "CMAKE_CUDA_ARCHITECTURES value passed to the benchmark runner."
        required: false
        default: "native"
        type: string
      base_ref:
        description: "Base Ref/SHA"
        required: false
        default: "origin/main"
        type: string
      test_ref:
        description: "Test Ref/SHA"
        required: false
        default: ""
        type: string
      cub_filters:
        description: "CUB filters, space-separated (ex: '^cub.bench.copy.memcpy.base$')"
        required: false
        default: ""
        type: string
      python_filters:
        description: "Python filters, space-separated (ex: 'compute/reduce/sum\\.py')"
        required: false
        default: ""
        type: string
      nvbench_args:
        description: "NVBench extra args"
        required: false
        default: ""
        type: string
      nvbench_compare_args:
        description: "nvbench-compare-robust extra args"
        required: false
        default: ""
        type: string
      nvbench_compare_legacy_args:
        description: "nvbench-compare-legacy extra args"
        required: false
        default: ""
        type: string
      raw_args:
        description: "Raw Args (advanced, bypasses all other inputs)"
        required: false
        default: ""
        type: string

jobs:
  ci:
    name: Run benchmark comparison
    permissions:
      contents: read
      id-token: write
    uses: NVIDIA/cccl/.github/workflows/bench.yml@ci
    secrets: inherit
    with:
      source_ref: ${{ github.sha }}
      gpu: ${{ inputs.gpu }}
      launch_args: ${{ inputs.launch_args }}
      arch: ${{ inputs.arch }}
      base_ref: ${{ inputs.base_ref }}
      test_ref: ${{ inputs.test_ref }}
      cub_filters: ${{ inputs.cub_filters }}
      python_filters: ${{ inputs.python_filters }}
      nvbench_args: ${{ inputs.nvbench_args }}
      nvbench_compare_args: ${{ inputs.nvbench_compare_args }}
      nvbench_compare_legacy_args: ${{ inputs.nvbench_compare_legacy_args }}
      raw_args: ${{ inputs.raw_args }}
