name: Approve SASS Diff

on:
  issue_comment:
    types: [created]

permissions:
  pull-requests: read
  issues: write
  actions: write
  checks: write

jobs:
  approve:
    # Expressions cannot match regexes; the first step validates the complete command.
    if: >-
      github.repository == 'NVIDIA/cccl' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.comment.body, '/sass diff ok')
    runs-on: ubuntu-slim

    steps:
      - name: Validate approval command
        id: request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { comment, issue } = context.payload;
            core.info(`Validate comment ${comment.id} from @${comment.user.login} on PR #${issue.number}.`);
            // Match both:
            //
            // /sass diff ok <full SHA>
            //
            // and
            //
            // /sass diff ok [<short SHA>](<link to full commit SHA>)
            const body = comment.body.trim();
            const plainMatch = /^\/sass diff ok\s+([0-9a-f]{40})$/.exec(body);
            const linkMatch  = /^\/sass diff ok\s+\[([0-9a-f]{7,40})\]\((https:\/\/github\.com\/[^\s)]+\/([0-9a-f]{40}))\)$/.exec(body);

            let sha;

            if (plainMatch) {
              sha = plainMatch[1];
              core.info(`Command contains a plain commit SHA: ${sha}.`);
            } else if (linkMatch) {
              sha = linkMatch[3];
              core.info(`Command contains a commit link for SHA ${sha}.`);
              // Check both the visible label and destination before accepting a commit link.
              const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
              if (
                !sha.startsWith(linkMatch[1]) ||
                ![`${repoUrl}/pull/${issue.number}/commits/${sha}`, `${repoUrl}/commit/${sha}`].includes(linkMatch[2])
              ) {
                core.info("Ignore command: the commit label or link destination does not match the expected commit.");
                return;
              }
            } else {
              core.info("Ignore comment: the command format is invalid.");
              return;
            }

            core.info(`Read the current head of PR #${issue.number}.`);
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: issue.number,
            });

            if (pr.head.sha !== sha) {
              core.info(`Ignore command: requested SHA ${sha} does not match PR head ${pr.head.sha}.`);
              return;
            }

            // Acknowledge that we have received the comment
            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

            if (comment.user.id === pr.user.id) {
              const body =
                `Error: @${comment.user.login}, you cannot approve SASS changes ` +
                "on your own pull request :raised_eyebrow:. " +
                "Please ask another CCCL developer to approve the SASS diff.";
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body,
              });
              return;
            }

            core.info(`Command is valid for SHA ${sha}.`);
            core.setOutput("sha", sha);

      # GITHUB_TOKEN cannot read organization membership. Limit the app token to that lookup.
      - name: Create membership token
        if: steps.request.outputs.sha != ''
        id: membership
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.CCCL_AUTH_APP_ID }}
          private-key: ${{ secrets.CCCL_AUTH_APP_PEM }}
          owner: NVIDIA
          repositories: cccl
          permission-members: read

      - name: Verify team membership
        if: steps.request.outputs.sha != ''
        id: authorization
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          github-token: ${{ steps.membership.outputs.token }}
          script: |
            core.info(`Check NVIDIA/cccl-codeowners membership for @${context.payload.comment.user.login}.`);
            // This endpoint includes child-team members and avoids membership lookup errors for nonmembers.
            const pages = github.paginate.iterator(github.rest.teams.listMembersInOrg, {
              org: "NVIDIA",
              team_slug: "cccl-codeowners",
              per_page: 100,
            });

            let found = false;
            let pageCount = 0;

            for await (const { data: members } of pages) {
              pageCount += 1;
              core.info(`Search membership page ${pageCount} with ${members.length} entries.`);
              if (members.some((member) => member.id === context.payload.comment.user.id)) {
                found = true;
                break;
              }
            }

            core.info(`Team authorization for @${context.payload.comment.user.login}: ${found}.`);
            core.setOutput("authorized", found);

        # Needs a separate step to the one above because the above uses the temporary
        # github token which only has members: read permissions and cannot post
        # comments. This one uses the default job-wide GITHUB_TOKEN which can post
        # comments.
      - name: Report unauthorized approval
        if: steps.authorization.outputs.authorized == 'false'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const body =
              `Error: @${context.payload.comment.user.login}, ` +
              "only CCCL developers may approve SASS changes. " +
              "Please ask a member of `cccl-codeowners` to review the SASS diffs.";

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body,
            });

      - name: Find the matching SASS comment and approve
        if: steps.authorization.outputs.authorized == 'true'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SHA: ${{ steps.request.outputs.sha }}
        with:
          script: |
            const { comment, issue } = context.payload;
            const number = issue.number;
            const sha = process.env.SHA;
            const marker = `<!-- sass-diff-GITHUB_SHA:${sha} -->`;
            // GraphQL exposes whether a comment is hidden; the REST endpoint does not.
            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $before: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    comments(last: 1, before: $before) {
                      nodes {
                        fullDatabaseId
                        body
                        isMinimized
                      }
                      pageInfo {
                        hasPreviousPage
                        startCursor
                      }
                    }
                  }
                }
              }
            `;
            let before = null;
            let report;

            core.info(`Search PR #${number} for a SASS report for SHA ${sha} before command ${comment.id}.`);

            while (true) {
              const { repository } = await github.graphql(query, {
                ...context.repo,
                number,
                before,
              });

              const comments = repository.pullRequest.comments;
              report = comments.nodes[0];
              core.debug(`Inspect comment ${report?.fullDatabaseId ?? "none"}; hidden=${report?.isMinimized ?? "unknown"}.`);
              // An earlier command cannot approve a later report.
              if (
                report &&
                BigInt(report.fullDatabaseId) < BigInt(comment.id) &&
                report.body.split(/\r?\n/).includes(marker)
              ) {
                core.info(`Matching SASS report: comment ${report.fullDatabaseId}.`);
                // We have found a report, but it has been minimized (marked hidden).
                // The only scenario in which this could happen is if the user has manually
                // hidden the previous report, and then launched a new pipeline and tried to
                // /sass diff ok before the new pipeline finished. We should not honor this.
                if (report.isMinimized) {
                  core.info("Ignore approval: the matching SASS report is hidden.");
                  return;
                }
                break;
              }
              if (!comments.pageInfo.hasPreviousPage) {
                // Didn't find a comment, so nothing to do. Likely the user has tried
                // to /sass diff ok before a SASS diff has been posted.
                core.info("Ignore approval: no matching SASS report precedes the command.");
                return;
              }
              before = comments.pageInfo.startCursor;
            }

            core.info(`Read workflow and check identifiers from report ${report.fullDatabaseId}.`);
            const run_id = Number(report.body.match(/^<!-- sass-diff-GITHUB_RUN_ID:(\d+) -->$/m)[1]);
            const attempt = Number(report.body.match(/^<!-- sass-diff-GITHUB_RUN_ATTEMPT:(\d+) -->$/m)[1]);
            const check_run_id = Number(report.body.match(/^<!-- sass-diff-CHECK_RUN_ID:(\d+) -->$/m)[1]);
            core.info(`Report identifies workflow run ${run_id}, attempt ${attempt}, check ${check_run_id}.`);

            // Read the check itself because an earlier approval can already have changed its conclusion.
            //
            // This can happen if a user posts 2 /sass diff ok comments in a row
            const { data: check } = await github.rest.checks.get({
              ...context.repo,
              check_run_id,
            });
            core.info(`Check ${check_run_id}: status=${check.status}, conclusion=${check.conclusion}.`);
            if (check.status !== "completed" || check.conclusion !== "failure") {
              core.info("Ignore approval: the check must be completed with a failure conclusion.");
              return;
            }

            core.info(`List jobs for workflow run ${run_id}, attempt ${attempt}.`);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo,
              run_id,
              attempt_number: attempt,
              per_page: 100,
            });
            const aggregate = jobs.find((job) => job.check_run_url === check.url);
            core.info(`Found ${jobs.length} jobs. Matching SASS job: ${aggregate?.id ?? "none"}.`);

            // Only the approval gate is overridable. Build, reporting, and cleanup failures must remain failures.
            const failures = aggregate.steps.filter(
              (step) => step.conclusion !== "success" && step.conclusion !== "skipped"
            );
            core.info(`Steps without success or skipped conclusions: ${JSON.stringify(failures.map(({ name, conclusion }) => ({ name, conclusion })))}.`);
            if (
              failures.length !== 1 ||
              failures[0].name !== "Require SASS approval" ||
              failures[0].conclusion !== "failure"
            ) {
              core.info("Ignore approval: the approval gate must be the only failed step, with all other steps successful or skipped.");
              return;
            }

            await github.rest.checks.update({
              ...context.repo,
              check_run_id,
              conclusion: "success",
              output: {
                title: "SASS changes approved",
                summary: `Approved by @${comment.user.login}: ${comment.html_url}`,
              },
            });
            core.info(`Check ${check_run_id} now has a success conclusion.`);

            // We now need to rerun the "CI" job so that the updated status result ends up in a
            // successful CI.
            core.info(`Refresh jobs for workflow run ${run_id}, attempt ${attempt}, to locate CI.`);
            const updatedJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo,
              run_id,
              attempt_number: attempt,
              per_page: 100,
            });

            // Unfortunately github provides no stable way of mapping the yaml key to
            // the job ID, so we need to do a named search.
            const ci = updatedJobs.find((job) => job.name === "CI");
            if (!ci) {
              core.error(`No CI job exists among ${updatedJobs.length} jobs for run ${run_id}, attempt ${attempt}.`);
              throw new Error(
                `Failed to find "CI" job in workflow run ${run_id}, attempt ${attempt}. ` +
                "This is a bug in CI itself"
              );
            }

            core.info(`CI job ${ci.id}: status=${ci.status}, conclusion=${ci.conclusion}.`);
            if (ci.status === "completed" && ci.conclusion === "failure") {
              await github.rest.actions.reRunJobForWorkflowRun({
                ...context.repo,
                job_id: ci.id,
              });
              core.info(`GitHub accepts the rerun request for CI job ${ci.id}.`);
            } else {
              core.info("Skip CI rerun: the job is not completed with a failure conclusion.");
            }

            await github.rest.reactions.createForIssueComment({
              ...context.repo,
              comment_id: comment.id,
              content: "+1",
            });
            core.info(`Approval processing is complete for PR #${number}, SHA ${sha}, check ${check_run_id}.`);
