name: ABI Diff

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_call:

permissions:
  contents: read

jobs:
  run:
    name: "ABI diff against the latest release"
    # No GPU is necessary: the headers are compiled, not run.
    runs-on: |-
      ${{ contains(fromJSON('["NVIDIA", "NVIDIA-dev"]'), github.repository_owner) &&
          'linux-amd64-cpu32' || 'ubuntu-latest' }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          # The comparison reads the release tags and archives the baseline from history.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compare ABI
        run: |
          mkdir -p abi-artifacts
          .devcontainer/launch.sh \
            -d \
            --volume "${GITHUB_WORKSPACE}/abi-artifacts:/abi-artifacts" \
            -- ./ci/abi/abi_diff.sh -output-dir /abi-artifacts

      - name: Upload the report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: abi-diff-report
          path: abi-artifacts/report.json
          if-no-files-found: ignore
