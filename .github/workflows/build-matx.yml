name: Build MatX

on:
  workflow_dispatch:
    inputs: &input_args
      source_repo:
        description: "Repository containing the source. Defaults to the caller repository."
        type: string
        default: ""
      source_ref:
        description: "Source branch, tag, or SHA. Defaults to the calling ref."
        type: string
        default: ""
      matrix_repo:
        description: "Repository containing the matrix. Defaults to the caller repository."
        type: string
        default: ""
      matrix_ref:
        description: "Matrix branch, tag, or SHA. Defaults to the calling ref."
        type: string
        default: ""
      matrix_path:
        description: "Path to the matrix file within matrix_repo."
        type: string
        default: "ci/matrix.yaml"
      override_cccl_tag:
        description: "If set, override the tag used when pulling the CCCL repository into MatX."
        required: false
        default: ""
        type: string
      override_cccl_version:
        description: "If set, override the version used by rapids-cmake to patch CCCL."
        required: false
        default: ""
        type: string
      enable_slack_alerts:
        description: "If true, a message will be posted to the CCCL GHA CI Alert channel if the workflow fails."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs: *input_args
    secrets:
      SLACK_CHANNEL_CI_ALERT:
        description: Slack channel ID for CI failure alerts.
        required: false
      SLACK_NOTIFIER_BOT_TOKEN:
        description: Slack bot token for CI notifications.
        required: false

jobs:
  build-matx:
    name: Build MatX
    if: ${{ github.repository_owner == 'NVIDIA' || github.repository_owner == 'NVIDIA-dev' }}
    runs-on: linux-amd64-cpu16m
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source and matrix
        id: checkout
        uses: $/.github/actions/workflow-checkout
        with:
          source_repo: ${{ inputs.source_repo || github.repository }}
          source_ref: ${{ inputs.source_ref || github.ref }}
          matrix_repo: ${{ inputs.matrix_repo || github.repository }}
          matrix_ref: ${{ inputs.matrix_ref || github.ref }}
          matrix_path: ${{ inputs.matrix_path }}
      - name: Add NVCC problem matcher
        run: echo "::add-matcher::$(pwd)/.github/problem-matchers/problem-matcher.json"
      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b  # v6
        with:
          role-to-assume: arn:aws:iam::279114543810:role/gha-oidc-NVIDIA
          aws-region: us-east-2
          role-duration-seconds: 43200 # 12h
      - name: Run command
        env:
          CCCL_TAG: ${{ inputs.override_cccl_tag }}
          CCCL_VERSION: ${{ inputs.override_cccl_version }}
          # Only retry once if a build server shuts down while compiling,
          # otherwise fallback to compiling locally
          SCCACHE_DIST_MAX_RETRIES: "1"
        run: |
          set -eo pipefail

          cat <<"EOF" > "$RUNNER_TEMP/ci.sh"
          #! /usr/bin/env bash
          set -eo pipefail
          ulimit -n $(ulimit -Hn)
          ~/cccl/ci/matx/build_matx.sh
          sccache --show-adv-stats
          EOF

          chmod +x "$RUNNER_TEMP/ci.sh"

          mkdir -p .aws

          cat <<EOF > .aws/config
          [default]
          bucket=rapids-sccache-devs
          region=us-east-2
          EOF

          cat <<EOF > .aws/credentials
          [default]
          aws_access_key_id=${AWS_ACCESS_KEY_ID:-}
          aws_session_token=${AWS_SESSION_TOKEN:-}
          aws_secret_access_key=${AWS_SECRET_ACCESS_KEY:-}
          EOF

          chmod 0600 .aws/credentials
          chmod 0664 .aws/config

          SCCACHE_DIST_URL="https://$(uname -m | sed -e 's/x86_/amd/' -e 's/aarch/arm/').linux.sccache.rapids.nvidia.com"

          SCCACHE_DIST_AUTH_TOKEN="$(
            curl -fsSL -H "Authorization: Bearer $(
                curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                  "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=token.rapids.nvidia.com"  |
                jq -r '.value'
              )" https://token.rapids.nvidia.com/gh/token/exchange |
            jq -r '.token'
          )"

          echo "::add-mask::$SCCACHE_DIST_AUTH_TOKEN"

          .devcontainer/launch.sh \
            --docker \
            --cuda 13.4 \
            --host gcc14 \
            --cuda-ext \
            --env "AWS_ROLE_ARN=" \
            --env "PARALLEL_LEVEL=$(ulimit -Hn)" \
            --env "CCCL_TAG=${CCCL_TAG}" \
            --env "CCCL_VERSION=${CCCL_VERSION}" \
            --env "GITHUB_ENV=$GITHUB_ENV" \
            --env "GITHUB_SHA=$GITHUB_SHA" \
            --env "GITHUB_PATH=$GITHUB_PATH" \
            --env "GITHUB_OUTPUT=$GITHUB_OUTPUT" \
            --env "GITHUB_ACTIONS=$GITHUB_ACTIONS" \
            --env "GITHUB_REF_NAME=$GITHUB_REF_NAME" \
            --env "GITHUB_RUN_ID=$GITHUB_RUN_ID" \
            --env "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" \
            --env "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" \
            --env "GITHUB_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" \
            --env "SCCACHE_DIST_URL=$SCCACHE_DIST_URL" \
            --env "SCCACHE_DIST_AUTH_TYPE=token" \
            --env "SCCACHE_DIST_AUTH_TOKEN=$SCCACHE_DIST_AUTH_TOKEN" \
            --volume "$RUNNER_TEMP/ci.sh:/ci.sh" \
            -- /ci.sh

  notify-failure:
    name: Notify Slack of MatX failure
    if: ${{ failure() && inputs.enable_slack_alerts }}
    needs: build-matx
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        uses: slackapi/slack-github-action@v1.26.0
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_BOT_TOKEN }}
          WORKFLOW_TYPE: ${{ github.workflow }}
          SUMMARY_URL: https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_CI_ALERT }}
          slack-message: |
            MatX build in workflow '${{ env.WORKFLOW_TYPE }}' failed.

            Details: ${{ env.SUMMARY_URL }}
