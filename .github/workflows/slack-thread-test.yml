name: Test Slack failure analysis thread

on:
  push:
    branches:
      - codex/nightly-ai-slack-links
    paths:
      - .github/workflows/slack-thread-test.yml

permissions: {}

jobs:
  render:
    name: Render test Slack thread
    if: >-
      ${{
        github.repository == 'NVIDIA/cccl' &&
        vars.SLACK_CHANNEL_CI_TEST == 'C0BR58S4VJ7'
      }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slack_thread: ${{ steps.render.outputs.content }}
    steps:
      - name: Check out CCCL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Write normalized failure analysis fixture
        env:
          ANALYSIS_FILE: ${{ runner.temp }}/failure-analysis.json
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          cat > "${ANALYSIS_FILE}" <<'JSON'
          {
            "run": {
              "id": 31561126707,
              "number": 772,
              "head_sha": "a0c21d1ec5e8602dc85f9ab289006bf1a72e2f96"
            },
            "jobs": [
              {
                "id": 94003495063,
                "name": "Thrust nightly build",
                "conclusion": "failure",
                "steps": [{"number": 4}]
              },
              {
                "id": 94005667778,
                "name": "CUB Clang nightly test",
                "conclusion": "failure",
                "steps": [{"number": 4}]
              }
            ],
            "groups": [
              {
                "title": "Compiler rejects unsupported launch flag",
                "explanation": "The build script rejects a generated option.",
                "evidence": [
                  {
                    "job_id": 94003495063,
                    "step_number": 4,
                    "lines": ["Unrecognized option: -lid0"]
                  }
                ],
                "root_cause": "The generated Thrust job passes the unsupported -lid0 option to build_thrust.sh.",
                "source_locations": [],
                "next_steps": "Remove the invalid project/job combination and rerun the affected configuration.",
                "agent_prompt": "Remove the invalid project/job combination and rerun the affected configuration.",
                "job_ids": [94003495063]
              },
              {
                "title": "Job failed without a retrievable log",
                "explanation": "GitHub reported a failed job but did not provide its log.",
                "evidence": [],
                "root_cause": "GitHub reported the job as failed, but its log download was unavailable, so the underlying cause is unknown.",
                "source_locations": [],
                "next_steps": "Open the job page and inspect its status and steps; rerun it if GitHub still has no log.",
                "agent_prompt": "Inspect the failed job page and rerun it if its log remains unavailable.",
                "job_ids": [94005667778]
              }
            ]
          }
          JSON

      - name: Render Slack failure analysis
        id: render
        uses: ./.github/actions/ci-failure-analysis-render
        with:
          analysis_file: ${{ runner.temp }}/failure-analysis.json
          format: slack

  publish:
    name: Post test Slack thread
    if: >-
      ${{
        github.repository == 'NVIDIA/cccl' &&
        vars.SLACK_CHANNEL_CI_TEST == 'C0BR58S4VJ7' &&
        needs.render.result == 'success'
      }}
    needs: render
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out Slack publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/util/publish_slack_thread.py
          sparse-checkout-cone-mode: false

      - name: Post test failure analysis thread
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ vars.SLACK_CHANNEL_CI_TEST }}
          SLACK_THREAD: ${{ needs.render.outputs.slack_thread }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          printf '%s' "${SLACK_THREAD}" | \
            python3 ci/util/publish_slack_thread.py
