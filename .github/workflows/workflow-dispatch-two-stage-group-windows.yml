name: "Workflow/Dispatch/TwoStageGroup/Windows"

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_call:
    inputs:
      pc-array:
        description: "The dispatch.json's windows_two_stage.jobs.<name> array of producer/consumer chains."
        type: string
        required: true
      repo:
        description: "Repository to checkout (e.g. 'NVIDIA/cccl')."
        type: string
        required: false
        default: ""
      commit:
        description: "Commit SHA or branch/ref to checkout."
        type: string
        required: false
        default: ""

jobs:
  dispatch-pcs:
    name: ${{ matrix.id }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.pc-array) }}
    uses: ./.github/workflows/workflow-dispatch-two-stage-windows.yml
    with:
      producers: ${{ toJSON(matrix.producers) }}
      consumers: ${{ toJSON(matrix.consumers) }}
      repo:      ${{ inputs.repo || github.repository }}
      commit:    ${{ inputs.commit || github.sha }}
