name: Pull Windows container E2E

on:
  push:
    branches:
      - codex/publish-windows-containers-e2e

permissions: {}

jobs:
  pull:
    name: Pull with read-only package permission
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      packages: read
    env:
      IMAGE: ghcr.io/nvidia/cccl-windows-containers:26.10-cuda13.3-cl14.29-windows2022
    steps:
      - name: Ensure Docker Engine is running
        shell: powershell
        run: |
          $dockerState = Get-Service -Name docker
          if ($dockerState.Status -ne 'Running') {
            Start-Service -Name docker
          }

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull published image
        shell: powershell
        run: |
          docker pull ${env:IMAGE}
          docker image inspect ${env:IMAGE} --format '{{json .RepoDigests}}'
