# Nightly scheduled workflow. Delegates matrix building and job dispatch to
# .github/workflows/ci-matrix-build.yml, then runs nightly-only third-party
# builds plus failure analysis and Slack notification.
name: nightly

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Repository containing the source. Defaults to the caller repository."
        type: string
        default: ""
      source_ref:
        description: "Source branch, tag, or SHA. Defaults to the calling ref."
        type: string
        default: ""
      matrix_repo:
        description: "Repository containing the matrix. Defaults to the caller repository."
        type: string
        default: ""
      matrix_ref:
        description: "Matrix branch, tag, or SHA. Defaults to the calling ref."
        type: string
        default: ""
      matrix_path: &matrix_path_input
        description: "Path to the matrix file within matrix_repo."
        type: string
        default: "ci/matrix.yaml"
  schedule:
    - cron: '0 3 * * 1-5' # 3AM UTC, 11PM EST, 8PM PST, Mon-Fri
  workflow_call:
    inputs:
      source_repo:
        description: "Repository containing the source. Defaults to the caller repository."
        type: string
        default: ${{ github.repository }}
      source_ref:
        description: "Source branch, tag, or SHA. Defaults to the calling ref."
        type: string
        default: ${{ github.ref }}
      matrix_repo:
        description: "Repository containing the matrix. Defaults to the caller repository."
        type: string
        default: ${{ github.repository }}
      matrix_ref:
        description: "Matrix branch, tag, or SHA. Defaults to the calling ref."
        type: string
        default: ${{ github.ref }}
      matrix_path: *matrix_path_input
    secrets:
      NVINFERENCE_API_KEY:
        description: NVIDIA Inference Hub API key for CI failure analysis and SASS triage.
        required: false
      SLACK_CHANNEL_CI_ALERT:
        description: Slack channel ID for CI failure alerts.
        required: false
      SLACK_CHANNEL_CI_LOG:
        description: Slack channel ID for CI logs.
        required: false
      SLACK_CHANNEL_RAPIDS_CI_ALERT:
        description: Slack channel ID for RAPIDS CI failure alerts.
        required: false
      SLACK_NOTIFIER_BOT_TOKEN:
        description: Slack bot token for CI notifications.
        required: false

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}-nightly-${{ inputs.source_repo }}@${{ inputs.source_ref }}-${{ inputs.matrix_repo }}@${{ inputs.matrix_ref }}-${{ inputs.matrix_path }}

jobs:

  matrix-build:
    name: Build & dispatch CI matrix
    uses: $/.github/workflows/ci-matrix-build.yml
    secrets: inherit
    with:
      workflows: nightly
      source_repo: &selected_source_repo ${{ inputs.source_repo || github.repository }}
      source_ref: &selected_source_ref ${{ inputs.source_ref || github.ref }}
      matrix_repo: &selected_matrix_repo ${{ inputs.matrix_repo || github.repository }}
      matrix_ref: &selected_matrix_ref ${{ inputs.matrix_ref || github.ref }}
      matrix_path: &selected_matrix_path ${{ inputs.matrix_path || 'ci/matrix.yaml' }}

  build-rapids:
    name: Build RAPIDS
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    uses: $/.github/workflows/build-rapids.yml
    with:
      source_repo: *selected_source_repo
      source_ref: *selected_source_ref
      matrix_repo: *selected_matrix_repo
      matrix_ref: *selected_matrix_ref
      matrix_path: *selected_matrix_path
      enable_slack_alerts: true

  build-matx:
    name: Build MatX
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    uses: $/.github/workflows/build-matx.yml
    with:
      source_repo: *selected_source_repo
      source_ref: *selected_source_ref
      matrix_repo: *selected_matrix_repo
      matrix_ref: *selected_matrix_ref
      matrix_path: *selected_matrix_path
      enable_slack_alerts: true

  build-pytorch:
    name: Build PyTorch
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    uses: $/.github/workflows/build-pytorch.yml
    with:
      source_repo: *selected_source_repo
      source_ref: *selected_source_ref
      matrix_repo: *selected_matrix_repo
      matrix_ref: *selected_matrix_ref
      matrix_path: *selected_matrix_path
      enable_slack_alerts: true

  analyze-failures:
    name: Analyze nightly failures
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.repository == 'NVIDIA/cccl' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (
          needs.matrix-build.result == 'failure' ||
          needs.build-rapids.result == 'failure' ||
          needs.build-matx.result == 'failure' ||
          needs.build-pytorch.result == 'failure'
        )
      }}
    needs:
      - matrix-build
      - build-rapids
      - build-matx
      - build-pytorch
    permissions:
      actions: read
      checks: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      slack_thread: ${{ steps.render-slack.outputs.content }}
    steps:
      - name: Check out CCCL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze failures
        id: analyze
        uses: $/.github/actions/ci-failure-analysis
        with:
          inference_api_key: ${{ secrets.NVINFERENCE_API_KEY }}
          run_id: ${{ github.run_id }}

      - name: Render GitHub verbose failure analysis summary
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        id: render-github-verbose-summary
        uses: $/.github/actions/ci-failure-analysis-render
        with:
          analysis_file: ${{ steps.analyze.outputs.analysis_file }}
          format: github-verbose-summary

      - name: Add failure analysis to workflow summary
        if: ${{ !cancelled() && steps.render-github-verbose-summary.outcome == 'success' }}
        env:
          SUMMARY_FILE: ${{ steps.render-github-verbose-summary.outputs.rendered_file }}
        run: |
          test -s "${SUMMARY_FILE}"
          cat "${SUMMARY_FILE}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Render Slack failure analysis
        if: ${{ !cancelled() && steps.analyze.outcome == 'success' }}
        id: render-slack
        uses: $/.github/actions/ci-failure-analysis-render
        with:
          analysis_file: ${{ steps.analyze.outputs.analysis_file }}
          format: slack

  publish-failure-notification:
    name: Post nightly failure notification to Slack
    if: >-
      ${{
        always() &&
        !cancelled() &&
        github.repository == 'NVIDIA/cccl' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
        (
          needs.matrix-build.outputs.failure_message != '' ||
          needs.analyze-failures.outputs.slack_thread != ''
        )
      }}
    needs:
      - analyze-failures
      - matrix-build
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Slack publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ci/util/publish_slack_notification.py
          sparse-checkout-cone-mode: false

      - name: Post failure notification
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFIER_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_CI_ALERT }}
          SLACK_PARENT_TEXT: ${{ needs.matrix-build.outputs.failure_message }}
          SLACK_THREAD: ${{ needs.analyze-failures.outputs.slack_thread }}
        shell: bash --noprofile --norc -euo pipefail {0}
        run: |
          printf '%s' "${SLACK_THREAD}" | \
            python3 ci/util/publish_slack_notification.py
