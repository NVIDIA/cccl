# Nightly scheduled workflow. Delegates matrix building and job dispatch to
# .github/workflows/ci-matrix-build.yml, then runs nightly-only third-party
# builds plus failure analysis and Slack notification.
name: nightly

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1-5' # 3AM UTC, 11PM EST, 8PM PST, Mon-Fri

concurrency:
  group: ${{ github.workflow }}-on-${{ github.event_name }}-from-${{ github.ref_name }}

jobs:

  matrix-build:
    name: Build & dispatch CI matrix
    uses: ./.github/workflows/ci-matrix-build.yml
    secrets: inherit
    with:
      workflows: nightly

  build-rapids:
    name: Build RAPIDS
    if: ${{ github.repository == 'NVIDIA/cccl' }}
    secrets: inherit
    permissions:
      actions: read
      packages: read
      id-token: write
      contents: read
      pull-requests: read
    uses: ./.github/workflows/build-rapids.yml
    with:
      enable_slack_alerts: true

  build-matx:
    name: Build MatX
    if: ${{ github.repository == 'NVIDIA/cccl' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/build-matx.yml
    with:
      enable_slack_alerts: true

  build-pytorch:
    name: Build PyTorch
    if: ${{ github.repository == 'NVIDIA/cccl' }}
    secrets: inherit
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/build-pytorch.yml
    with:
      enable_slack_alerts: true
