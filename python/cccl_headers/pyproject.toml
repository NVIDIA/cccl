[build-system]
requires = ["scikit-build-core>=1.0", "setuptools_scm"]
build-backend = "scikit_build_core.build"

[project]
name = "cccl-headers"
description = "C++ headers for the CUDA Core Compute Libraries"
authors = [{ name = "NVIDIA Corporation" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Environment :: GPU :: NVIDIA CUDA",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
]
requires-python = ">=3.10"
dependencies = ["cuda-pathfinder>=1.2.3"]
dynamic = ["version"]
readme = { file = "README.md", content-type = "text/markdown" }

[project.urls]
Homepage = "https://github.com/NVIDIA/cccl"
Repository = "https://github.com/NVIDIA/cccl"
Documentation = "https://nvidia.github.io/cccl"
Issues = "https://github.com/NVIDIA/cccl/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake]
version = ">=3.21"
args = []
build-type = "Release"
source-dir = "."

[tool.scikit-build.ninja]
version = ">=1.11"
make-fallback = true

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
root = "../.."
git_describe_command = ["git", "describe", "--tags", "--match", "v[0-9]*"]
fallback_version = "0.0.0"

[tool.scikit-build.wheel]
py-api = "py3"
platlib = false
license-files = []
reproducible = true

[tool.scikit-build.wheel.force-include]
"../../LICENSE" = "${SKBUILD_METADATA_DIR}/licenses/LICENSE"
"../../cub/LICENSE.TXT" = "${SKBUILD_METADATA_DIR}/licenses/cub/LICENSE.TXT"
"../../cudax/LICENSE.TXT" = "${SKBUILD_METADATA_DIR}/licenses/cudax/LICENSE.TXT"
"../../libcudacxx/LICENSE.TXT" = "${SKBUILD_METADATA_DIR}/licenses/libcudacxx/LICENSE.TXT"
"../../thrust/LICENSE" = "${SKBUILD_METADATA_DIR}/licenses/thrust/LICENSE"

[tool.scikit-build.wheel.packages]
"cuda" = "cuda"

[tool.mypy]
cache_dir = "../../.cache/mypy"
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["cuda.pathfinder.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["cuda.cccl", "cuda.cccl.headers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--import-mode=importlib",
  "--strict-config",
  "--strict-markers",
]
xfail_strict = true
